<script>
var LS=[];
// batch 1: pages 5-15
LS.push(
{id:"quran",t:"ما نحفظ من القرآن الكريم والحديث الشريف",k:"lesson",p:[5,6],ill:6,
 tx:[
 "قالَتْ شَيْمَاءُ لأَخِيها: ماذا تَحْفَظُ مِنَ القُرآنِ الكَريمِ يا أَحْمَدُ؟",
 "قالَ أَحْمَدُ: أَحْفَظُ سُورَةَ الفاتِحَةِ ، وسُورَةَ العَلَقِ ، وسُورَةَ الإِخْلاصِ.",
 "قالَتْ شَيْمَاءُ: أَسْمِعْنِي قِراءَةَ سُورَةِ الإِخْلاصِ.",
 "فَبَدَأَ أَحْمَدُ يَقْرَأُ ويَقولُ:",
 "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ",
 "قُلْ هُوَ اللَّهُ أَحَدٌ ، اللَّهُ الصَّمَدُ ، لَمْ يَلِدْ وَلَمْ يُولَدْ ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
 "قالَتْ شَيْمَاءُ: وما مَعْناها؟",
 "قالَ أَحْمَدُ: إِنَّ اللَّهَ سُبْحانَهُ وتَعالى واحِدٌ لا شَريكَ لَهُ ، ولا يُنْسَبُ لأَحَدٍ ، وهُوَ الَّذِي نَقْصِدُهُ في الحاجاتِ دائِماً ، وهُوَ مُنَزَّهٌ ليسَ لَهُ مَثيلٌ أَوْ شَبيهٌ.",
 "قالَتْ شَيْمَاءُ: ما تَحْفَظُ مِنَ الحَديثِ النَّبَوِيِّ الشَّريفِ؟",
 "قالَ أَحْمَدُ: قالَ النَّبِيُّ مُحَمَّدٌ ﷺ:",
 "(خَيْرُ الجِيرانِ عِنْدَ اللَّهِ خَيْرُهُمْ لِجارِهِ)",
 "قالَتْ شَيْمَاءُ: وما مَعْناهُ؟",
 "قالَ أَحْمَدُ: جِيرانُنا أَقْرَبُ النَّاسِ إِلَيْنا. لِذلِكَ فَإِنَّ النَّبِيَّ يوصينا بِأَنْ نَحْتَرِمَ الجيرانَ ونُساعِدَهُمْ. فَإِذا أَحْبَبْنا جِيرانَنا وساعَدْناهُمْ ، أَحَبُّونا وساعَدونا ، بِذلِكَ نَكونُ أَحْسَنَ الجِيرانِ عِنْدَ اللَّهِ رَبِّنا سُبْحانَهُ وتَعالى؛ فَيَرْضى عَنَّا."
 ]},

{id:"school",t:"الذَّهابُ إلى المَدْرَسَةِ",k:"lesson",p:[9,10,11,12],ill:9,
 tx:[
 "عَبْدُ اللَّهِ يَقولُ:",
 "أَنا في الصَّفِّ الثَّالِثِ ، أَنْتِ يا نورُ في الصَّفِّ الثَّاني هَيَّا نَذْهَبْ إلى المَدْرَسَةِ.",
 "قالَتْ نورُ:",
 "أَنا أُحِبُّ المَدْرَسَةَ ، أُريدُ أَنْ أَرى صَديقاتي ، وأُسَلِّمَ على مُعَلِّمَتي.",
 "مَشى عَبْدُ اللَّهِ ونورُ في الطَّريقِ إلى المَدْرَسَةِ ، ولَمَّا وَصَلا إلى مِنْطَقَةِ العُبورِ أَرادَ عَبْدُ اللَّهِ أَنْ يَعْبُرَ الشَّارِعَ ، فَقالَتْ نورُ:",
 "قِفْ يا عَبْدَ اللَّهِ ، انْظُرْ إلى الإِشارَةِ الجانِبِيَّةِ ذاتِ اللَّوْنَيْنِ الضَّوْءُ فيها أَحْمَرُ ، انْتَظِرْ حَتَّى يَصيرَ الضَّوْءُ أَخْضَرَ.",
 "قالَ عَبْدُ اللَّهِ:",
 "نَعَمْ. الآنَ صارَ الضَّوْءُ أَخْضَرَ ، هَيَّا نَعْبُرْ يا نورُ.",
 "عَبَرَ عَبْدُ اللَّهِ ونورُ الشَّارِعَ ، فَوَصَلا إلى المَدْرَسَةِ.",
 "كانَ التَّلاميذُ في ساحَةِ المَدْرَسَةِ ، وكانَتْ ساحَةُ المَدْرَسَةِ نَظيفَةً.",
 "سَلَّمَ عَبْدُ اللَّهِ على أَصْدِقائِهِ وسَلَّمَتْ نورُ على صَديقاتِها ، ثُمَّ ذَهَبا إلى المُعَلِّمَةِ وسَلَّما عَلَيْها.",
 "سَمِعَ التَّلاميذُ صَوْتَ الجَرَسِ يُدَقُّ لِلدَّرْسِ فَدَخَلوا صُفوفَهُمْ فَرِحينَ.",
 "دَخَلَتِ المُعَلِّمَةُ الصَّفَّ وقالَتْ:",
 "أَهْلاً بِكُمْ يا أَوْلادي.",
 "حافِظوا على نَظافَةِ المَدْرَسَةِ.",
 "قالَ التَّلاميذُ: نَعَمْ ... نَعَمْ ، النَّظافَةُ مِنَ الإيمانِ.",
 "قالَتِ المُعَلِّمَةُ: هَيَّا نَقْرَأْ ونَتَعَلَّمْ."
 ]},

{id:"dove",t:"الحَمامَةُ والنَّمْلَةُ",k:"lesson",p:[13,14,15],ill:13,
 tx:[
 "عَطِشَتْ حَمامَةٌ فَأَتَتْ غَديرَ ماءٍ تَرْتَوي مِنْهُ ، فَرَأَتْ نَمْلَةً قَدْ سَقَطَتْ في الماءِ وأَشْرَفَتْ على الهَلاكِ.",
 "فَأَشْفَقَتْ عَلَيْها ، ورَمَتْ إلَيْها وَرَقَةَ شَجَرٍ يابِسَةً ، تَعَلَّقَتْ بِها النَّمْلَةُ ونَجَتْ مِنَ الغَرَقِ.",
 "وفي اليَوْمِ الثَّاني أَبْصَرَتِ النَّمْلَةُ صَيَّاداً ، يُريدُ أَنْ يَصيدَ الحَمامَةَ فَقالَتْ في نَفْسِها:",
 "هذا الصَّيَّادُ سَيَقْتُلُ الحَمامَةَ بِالبُنْدُقِيَّةِ ، وهذِهِ الحَمامَةُ أَنْقَذَتْني مِنَ المَوْتِ فَعَلَيَّ أَنْ أَرُدَّ جَميلَها ومَعْروفَها الَّذي أَسْدَتْهُ لي.",
 "فَدَنَتِ النَّمْلَةُ مِنَ الصَّيَّادِ ولَسَعَتْهُ في رِجْلِهِ ، ولَمَّا الْتَفَتَ وصاحَ مِنَ الأَلَمِ سَمِعَتِ الحَمامَةُ صِياحَهُ فَطارَتْ ونَجَتْ مِنَ المَوْتِ."
 ],
 w:[["أَشْرَفَتْ على الهَلاكِ","كادَتْ أَنْ تَموتَ"],["أَسْدَتْهُ","قَدَّمَتْهُ"],["دَنَتْ","اقْتَرَبَتْ"]]},

{id:"week",t:"اليَوْمُ والأُسْبوعُ والشَّهْرُ والسَّنَةُ",k:"expr",p:[8],
 tx:[
 "اليَوْمُ الواحِدُ لَيْلٌ ونَهارٌ ، أَرْبَعٌ وعِشْرونَ ساعَةً.",
 "الأُسْبوعُ سَبْعَةُ أَيَّامٍ هِيَ: السَّبْتُ ، والأَحَدُ ، والاثْنَيْنِ ، والثُّلاثاءُ ، والأَرْبِعاءُ ، والخَميسُ ، والجُمُعَةُ.",
 "الشَّهْرُ أَرْبَعَةُ أَسابيعَ.",
 "والشَّهْرُ ثَلاثونَ يَوْماً.",
 "السَّنَةُ اثْنا عَشَرَ شَهْراً.",
 "والسَّنَةُ ثَلاثُمِئَةٍ وخَمْسَةٌ وسِتّونَ يَوْماً."
 ],
 khat:"خَيْرُ الجيرانِ عِنْدَ اللَّهِ خَيْرُهُمْ لِجارِهِ."}
);
// batch 2: pages 16-23
LS.push(
{id:"holidays",t:"أَيّامُ العُطَلِ والأَعْيادِ",k:"expr",p:[16],
 tx:[
 "لا نَذْهَبُ إلى المَدْرَسَةِ يَوْمَ الجُمُعَةِ ، والعُطْلَةِ الرَّبيعِيَّةِ ، والعُطْلَةِ الصَّيْفِيَّةِ ، والأَعْيادِ.",
 "السَّنَةُ الهِجْرِيَّةُ بَدَأَتْ بِهِجْرَةِ النَّبِيِّ مُحَمَّدٍ ﷺ مِنْ مَكَّةَ المُكَرَّمَةِ إلى المَدينَةِ المُنَوَّرَةِ.",
 "السَّنَةُ المِيلادِيَّةُ بَدَأَتْ بِميلادِ السَّيِّدِ المَسيحِ عيسى بنِ مَرْيَمَ عَلَيْهِ السَّلامُ.",
 "الأَعْيادُ هِيَ: عيدُ الفِطْرِ المُبارَكُ ، وعيدُ الأَضْحى المُبارَكُ ، وعيدُ المَوْلِدِ النَّبَوِيِّ الشَّريفِ ، وعيدُ ميلادِ السَّيِّدِ المَسيحِ عَلَيْهِ السَّلامُ."
 ],
 khat:"المَدْرَسَةُ تُرَبِّينا وتُعَلِّمُنا القِراءَةَ والكِتابَةَ."},

{id:"cleaner",t:"عامِلُ النَّظافَةِ",k:"lesson",p:[17,18,19,20],ill:18,
 tx:[
 "ظافِرٌ عامِلُ نَظافَةٍ نَشيطٌ ، يَسْتَيْقِظُ كُلَّ يَوْمٍ مُبَكِّراً ، ويَقِفُ عِنْدَ بابِ دارِهِ بانْتِظارِ سَيّارَةِ دائِرَةِ الخَدَماتِ ، لِيَصِلَ إلى مَكانِ عَمَلِهِ ويَجِدَ صاحِبَهُ حُسَاماً الَّذي يُرافِقُهُ في سَيّارَةِ النَّظافَةِ مَعَ السّائِقِ سَعيدٍ ، إِنَّنا نُحِبُّ ونَحْتَرِمُ العامِلَ ظافِراً ؛ لأَنَّهُ يَمُرُّ على أَبْوابِ مَحَلَّتِنا ، يَجْمَعُ أَكْياسَ نِفاياتِ البُيوتِ مِنْ دونِ إِهْمالٍ لِتَظَلَّ البُيوتُ والشَّوارِعُ نَظيفَةً وجَميلَةً.",
 "إِنَّنا نُساعِدُ عامِلَ النَّظافَةِ ؛ لأَنَّهُ يُحافِظُ على صِحَّتِنا ، وبِعَمَلِهِ يُبْعِدُنا مِنَ الإِصابَةِ بِالأَمْراضِ ، وتَظَلُّ الشَّوارِعُ نَظيفَةً وأَرْصِفَتُها جَميلَةً بِأَلْوانِها البَيْضِ والصُّفْرِ.",
 "نُساعِدُ ظافِراً قَبْلَ الذَّهابِ إلى المَدْرَسَةِ فَنَحْمِلُ أَكْياسَ النِّفاياتِ ونَضَعُها على مَقْرُبَةٍ مِنَ الرَّصيفِ ، لِكَيْلا يَتْعَبَ ، ويَبْقى ظافِرٌ وصاحِبُهُ حُسامٌ نَشيطَيْنِ.",
 "يُساعِدُهُ السّائِقُ سَعيدٌ بِتَنْبيهِ أَهْلِ المَحَلَّةِ لِيَكونوا على عِلْمٍ بِقُدومِ سَيّارَةِ النَّظافَةِ ، وظافِرٌ يُنادينا بِصَوْتِهِ الحَنونِ (النَّظافَةُ مِنَ الإيمانِ).",
 "إِنَّنا نَدْعو لِظافِرٍ وصاحِبَيْهِ بِالقُوَّةِ والسَّلامَةِ ، لِتَظَلَّ مَحَلَّتُنا نَظيفَةً وجَميلَةً."
 ],
 w:[["يَسْتَيْقِظُ","يَصْحو مِنْ نَوْمِهِ"],["إِهْمالٌ","تَقْصيرٌ"]],
 khat:"نَحْنُ نُحِبُّ عامِلَ النَّظافَةِ ، لأَنَّهُ بِعَمَلِهِ يُحافِظُ على صِحَّتِنا."},

{id:"clean2",t:"النَّظافَةُ في البَيْتِ والمَدْرَسَةِ",k:"expr",p:[21],
 tx:[
 "النَّظافَةُ عامِلٌ أَساسِيٌّ في حَياةِ الفَرْدِ لِذلِكَ يَجِبُ المُحافَظَةُ عَلَيْها بِجَميعِ مَجالاتِها البَدَنِيَّةِ والمَنْزِلِيَّةِ والمَدْرَسِيَّةِ كَما يَأْتي:",
 "النَّظافَةُ البَدَنِيَّةُ: يَجِبُ الاسْتِحْمامُ اليَوْمِيُّ لِلْبَدَنِ ، والمُحافَظَةُ على غَسْلِ المَلابِسِ وارْتِداءِ مَلابِسَ نَظيفَةٍ ، والمُحافَظَةُ على الأَسْنانِ ، إِذْ يَجِبُ غَسْلُها يَوْمِيّاً ثَلاثَ مَرّاتٍ. والمُحافَظَةُ على نَظافَةِ الأُذُنِ والعَيْنِ ونَظافَةِ الشَّعْرِ.",
 "النَّظافَةُ المَنْزِلِيَّةُ: يَجِبُ المُحافَظَةُ على نَظافَةِ السَّريرِ وغُرْفَةِ النَّوْمِ وعَدَمِ رَمْيِ القاذوراتِ والأَوْراقِ والأَوْساخِ في المَنْزِلِ.",
 "النَّظافَةُ المَدْرَسِيَّةُ: يَجِبُ المُحافَظَةُ على نَظافَةِ الصَّفِّ وعلى الكُتُبِ المَدْرَسِيَّةِ وعَدَمِ اتْلافِها ، والمُحافَظَةُ على جُدْرانِ الصَّفِّ والسّاحَةِ المَدْرَسِيَّةِ ووَضْعِ سَلَّةٍ لِلْقُمامَةِ في الصَّفِّ لِرَمْيِ المُخَلَّفاتِ."
 ],
 khat:"نَحْنُ نُحِبُّ عامِلَ النَّظافَةِ ، لأَنَّهُ بِعَمَلِهِ يُحافِظُ على صِحَّتِنا."},

{id:"parents",t:"أَبي وأُمّي",k:"poem",p:[22],ill:22,
 tx:[
 "يا رَبَّنا يا ذا الكَرَمْ",
 "يا واهِباً كُلَّ النِّعَمْ",
 "هذا أَبي نِعْمَ الأَبْ",
 "مِنْ أَجْلِنا كَمْ يَتْعَبْ",
 "أُمّي الَّتي أُحِبُّها",
 "مَنْ مِثْلُها في فَضْلِها",
 "بارِكْهُما يا رَبَّنا",
 "واحْفَظْهُما دَوْماً لَنا"
 ]},

{id:"winter",t:"فَصْلُ الشِّتاءِ",k:"expr",p:[23],
 tx:[
 "تَكْثُرُ الغُيومُ المُمْطِرَةُ في السَّماءِ شِتاءً.",
 "يَكونُ الجَوُّ بارِداً ، وتَهُبُّ الرِّياحُ.",
 "وتَسْقُطُ الأَمْطارُ ، ويَحْدُثُ البَرْقُ والرَّعْدُ.",
 "يَكونُ اللَّيْلُ في الشِّتاءِ طَويلاً ، والنَّهارُ قَصيراً.",
 "نَلْبَسُ المَلابِسَ الثَّقيلَةَ ، ونَسْتَعْمِلُ المَدافِئَ."
 ],
 khat:"قالَ السَّيِّدُ المَسيحُ عَلَيْهِ السَّلامُ: الحَقُّ يُحَرِّرُ الإِنْسانَ"}
);
// batch 3: pages 24-31
LS.push(
{id:"animals",t:"الرِّفْقُ بِالحَيَوانِ",k:"lesson",p:[24,25,26,27],ill:24,
 tx:[
 "رَأى الإِمامُ عَلِيٌّ عَلَيْهِ السَّلامُ غُلاماً يَضْرِبُ حِمارَهُ بِالعَصا حَتَّى سالَ دَمُهُ مِنْ أُذُنَيْهِ.",
 "فَقالَ لَهُ: ارْحَمْ دابَّتَكَ يا بُنَيَّ.",
 "قالَ الغُلامُ: هُوَ حَيَوانٌ لا يَفْهَمُ يا سَيِّدي.",
 "فَقالَ عَلَيْهِ السَّلامُ: أَما قَرَأْتَ القُرآنَ؟",
 "أَجابَ الغُلامُ: هَلْ ذَكَرَ القُرآنُ الكَريمُ ذلِكَ؟",
 "قالَ عَلَيْهِ السَّلامُ: أَلَمْ تَسْمَعْ قَوْلَهُ تَعالى: وَما مِنْ دابَّةٍ في الأَرْضِ وَلا طائِرٍ يَطيرُ بِجَناحَيْهِ إِلّا أُمَمٌ أَمْثالُكُمْ ما فَرَّطْنا في الكِتابِ مِنْ شَيْءٍ ثُمَّ إِلى رَبِّهِمْ يُحْشَرونَ.",
 "نَدِمَ الغُلامُ وأَخَذَ يَبْكي ويَقولُ: أَسْتَغْفِرُ اللَّهَ. أَسْتَغْفِرُ اللَّهَ سامِحْني يا رَبِّ."
 ],
 w:[["غُلام","وَلَدٌ"],["دابَّةٌ","حَيَوانٌ"],["أَجابَ","رَدَّ على السُّؤالِ"],["أُمَمٌ","مَجْموعَةٌ مِنَ الأَفْرادِ"],["ما فَرَّطْنا","ما أَهْمَلْنا"],["يُحْشَرونَ","يُبْعَثونَ يَوْمَ القِيامَةِ"]],
 khat:"ارْحَموا مَنْ في الأَرْضِ يَرْحَمْكُمْ مَنْ في السَّماءِ."},

{id:"clock",t:"كُنْ مِثْلَ السّاعَةِ والقَلْبِ",k:"lesson",p:[28,29,30],ill:28,
 tx:[
 "قالَ أَحْمَدُ: السّاعَةُ تَعْمَلُ بِدِقَّةٍ ونِظامٍ: تِك تاك ، تِك تاك.",
 "الَّذي يَعْمَلُ بِدِقَّةٍ ونِظامٍ ، نَقولُ فيهِ: إِنَّهُ مِثْلُ السّاعَةِ.",
 "قالَتْ فاطِمَةُ: والقَلْبُ يَعْمَلُ بِدِقَّةٍ ونِظامٍ: دُم دام ، دُم دام.",
 "يَنْبَسِطُ فَيَسْتَقْبِلُ الدَّمَ الفاسِدَ ، وَيَنْقَبِضُ فَيَدْفَعُ الدَّمَ النَّقِيَّ.",
 "قالَ هِشامٌ: والقَلْبُ في انْبِساطِهِ وانْقِباضِهِ ، غايَةٌ في الدِّقَّةِ والنِّظامِ. ودَقّاتُ القَلْبِ المُنْتَظِمَةُ دَليلٌ على صِحَّةِ الإِنْسانِ.",
 "قالَتْ زَيْنَبُ: والدَّقّاتُ غَيْرُ المُنْتَظِمَةِ دَليلٌ على مَرَضِهِ فَهَلْ أَنْتَ مِثْلُ السّاعَةِ والقَلْبِ يا هِشامُ تَعْمَلُ بِدِقَّةٍ ونِظامٍ؟"
 ],
 w:[["يَنْبَسِطُ القَلْبُ","يَتَمَدَّدُ ويَمْتَلِئُ دَماً فاسِداً"],["يَنْقَبِضُ القَلْبُ","يَتَقَلَّصُ فَيَدْفَعُ الدَّمَ النَّقِيَّ"]],
 khat:"المَشْيُ يُساعِدُ القَلْبَ على العَمَلِ بِدِقَّةٍ وانْتِظامٍ."},

{id:"whoami",t:"مَنْ أَنا؟",k:"poem",p:[31],ill:31,
 tx:[
 "مَخْلوقَةٌ غَريبَةْ ، صَغيرَةٌ عَجيبَةْ",
 "أَعْمَلُ باسْتِمْرارْ ، في اللَّيْلِ والنَّهارْ",
 "أَعيشُ في خَلايا ، كَثيرَةِ الزَّوايا",
 "أَطيرُ لِلأَشْجارْ ، والزَّهْرِ والثِّمارْ",
 "أَمْتَصُّ مِنْها الماءْ ، وأَجْمَعُ الغِذاءْ",
 "إِذا أَتَيْتَ عِنْدي ، وَجَدْتَ حُلْوَ الشَّهْدِ",
 "مِنْ عَسَلٍ مُصَفّى ، تَأْكُلُهُ فَتَشْفى",
 "فَهَلْ عَرَفْتَ رَسْمي ، وَمَنْ أَنا وما اسْمي"
 ],
 w:[["الشَّهْدُ","العَسَلُ"],["عَسَلٌ مُصَفّى","عَسَلٌ خالِصٌ ، خالٍ مِنَ الشَّمْعِ وغَيْرِهِ"]]}
);
// batch 4: pages 32-35
LS.push(
{id:"spring",t:"فَصْلُ الرَّبيعِ",k:"expr",p:[32],
 tx:[
 "يَكونُ الجَوُّ في فَصْلِ الرَّبيعِ مُعْتَدِلاً. لا حارّاً ولا بارِداً.",
 "تُورِقُ الأَشْجارُ ، وتَظْهَرُ الأَزْهارُ ، وتُغَرِّدُ الطُّيورُ.",
 "يَبْدَأُ فَصْلُ الرَّبيعِ في شَهْرِ آذارَ ، وفيهِ عيدُ الرَّبيعِ أَوْ عيدُ الشَّجَرَةِ.",
 "أَنا أُحِبُّ الرَّبيعَ ، لَيْتَ الزَّمانَ كُلَّهُ رَبيعٌ."
 ],
 khat:"أُحِبُّ اللُّغَةَ العَرَبِيَّةَ ؛ لأَنَّها لُغَةُ القُرآنِ الكَريمِ."},

{id:"shepherd",t:"الرّاعي الأَمينُ",k:"lesson",p:[33,34,35],ill:33,
 tx:[
 "كانَ غَسّانُ يَرْعى غَنَماً في الوادي القَريبِ مِنَ القَرْيَةِ. مَرَّ بِهِ رَجُلٌ يَرْكَبُ حِصاناً فَسَلَّمَ عَلَيْهِ وقالَ لَهُ:",
 "بِعْني نَعْجَةً أَيُّها الغُلامُ.",
 "قالَ لَهُ غَسّانُ: لا ، يا عَمّي. هذِهِ الغَنَمُ لا تَعودُ لي. أَنا أَرْعاها بِأَجْرٍ.",
 "فَقالَ الرَّجُلُ: قُلْ لِصاحِبِها: أَكَلَها الذِّئْبُ.",
 "أَجابَهُ غَسّانُ: لا ، يا عَمّي .. أَنا لا أَخونُ الأَمانَةَ.",
 "ضَحِكَ الرَّجُلُ وقالَ: بارَكَ اللَّهُ فيكَ يا وَلَدي. أَنْتَ وَلَدٌ ذَكِيٌّ وأَمينٌ. تَعالَ اسْرَحْ بِغَنَمي وأُعْطيكَ أَجْراً مُضاعَفاً.",
 "فَقالَ غَسّانُ: شُكْراً لَكَ يا عَمّي. أَنا هُنا في قَرْيَتي قانِعٌ بِرِزْقي.",
 "ثُمَّ وَدَّعَهُ وهُوَ يَقولُ: ما أَجْمَلَ أَنْ يَكونَ الإِنْسانُ أَميناً! وما أَحْلى أَنْ يَكونَ قَنوعاً!"
 ]}
);
// batch 5: pages 36-43
LS.push(
{id:"guard",t:"الحارِسُ",k:"expr",p:[36],
 tx:[
 "الحارِسُ اللَّيْلِيُّ يَحْرُسُ النّاسَ وبُيوتَهُمْ مِنَ العُدْوانِ والسَّرِقَةِ.",
 "وهُوَ يَحْمي المالَ العامَّ ودَوائِرَ الدَّوْلَةِ.",
 "يَحْمِلُ الحارِسُ بُنْدُقِيَّةً وعَصاً وصافِرَةً لِلتَّنْبيهِ.",
 "يَسْتَعينُ الحارِسُ بِالشُّرْطَةِ ، أَنا أُحِبُّ أَفْرادَ الشُّرْطَةِ وأَحْتَرِمُهُمْ وأُساعِدُ دُورِيّاتِهِمْ ، وأَتَعاوَنُ مَعَهُمْ.",
 "الشُّرْطَةُ تَحْمي النّاسَ وأَمْوالَهُمْ مِنَ الأَشْرارِ ، وتُحافِظُ على راحَةِ النّاسِ وأَمْنِهِمْ واسْتِقْرارِهِمْ."
 ],
 khat:"أُحِبُّ الشُّرْطَةَ وأَحْتَرِمُهُمْ وأَتَعاوَنُ مَعَهُمْ."},

{id:"king",t:"المَلِكُ الخادِمُ",k:"lesson",p:[37,38,39],ill:37,
 tx:[
 "كانَ هُناكَ مَلِكٌ مُتَكَبِّرٌ ومَغْرورٌ ، جَلَسَ على عَرْشِهِ في يَوْمٍ مِنَ الأَيّامِ ، وقالَ لِشَعْبِهِ: إِنَّكُمْ جَميعاً خَدَمٌ لي. فَصاحَ أَحَدُ الحاضِرينَ: كُلُّنا نَخْدُمُ بَعْضَنا بَعْضاً ، فَصاحَ المَلِكُ: مَنِ المُتَكَلِّمُ؟",
 "أَجابَهُ شَيْخٌ كَبيرٌ قائِلاً: أَنا مِنْ قَرْيَةٍ بَعيدَةٍ في مَمْلَكَتِكَ ، جِئْتُ إلى قَصْرِكَ لأَنَّهُ لا يوجَدُ ماءٌ في قَرْيَتِنا.",
 "قالَ المَلِكُ: كَيْفَ تَجْرُؤُ على قَوْلِ هذا الكَلامِ؟",
 "قالَ الشَّيْخُ: سَأُثْبِتُ لَكَ صِحَّةَ كَلامي قَبْلَ مَجيءِ اللَّيْلِ.",
 "قالَ المَلِكُ: أَتَحَدّاكَ ، وإِنْ أَثْبَتَّ لي كَلامَكَ ، سَوْفَ آمُرُ بِحَفْرِ بِئْرٍ في قَرْيَتِكَ.",
 "فَقالَ الشَّيْخُ: اتْبَعْني فَتَبِعَهُ المَلِكُ ، والْتَفَتَ إِلَيْهِ الشَّيْخُ قائِلاً: لَهُ أَحْمِلْ عَصايَ وبَعْدَ أَنْ سارا بِضْعَ خُطُواتٍ ، قالَ لَهُ: أَعْطِني عَصايَ ، فَأَعْطاهُ المَلِكُ العَصا.",
 "قالَ الشَّيْخُ: أَتُريدُ إِثْباتاً أَكْبَرَ مِنْ هذا؟ لَقَدْ خَدَمْتَني وحَمَلْتَ لي العَصا.",
 "ضَحِكَ المَلِكُ وفَرِحَ بِذَكاءِ هذا الشَّيْخِ وأَمَرَ بِحَفْرِ بِئْرٍ في قَرْيَتِهِ وعَيَّنَهُ مُسْتَشاراً لَهُ."
 ],
 w:[["بِئْرٌ","حُفْرَةٌ عَميقَةٌ في الأَرْضِ يَخْرُجُ مِنْها الماءُ"]],
 khat:"كُلُّنا نَخْدُمُ بَعْضَنا بَعْضاً."},

{id:"omar",t:"عُمَرُ العادِلُ",k:"lesson",p:[40,41,42],ill:40,
 tx:[
 "خَرَجَ الخَليفَةُ عُمَرُ بْنُ الخَطّابِ رَضِيَ اللَّهُ عَنْهُ ، يَتَفَقَّدُ أَحْوالَ النّاسِ فَوَجَدَ امْرَأَةً تُشْعِلُ ناراً تَحْتَ قِدْرٍ ، وحَوْلَها أَطْفالٌ يَبْكونَ ، فَسَأَلَها الخَليفَةُ قائِلاً: لِماذا يَبْكي الأَطْفالُ؟",
 "قالَتْ: إِنَّهُمْ يَبْكونَ مِنَ الجوعِ.",
 "فَقالَ الخَليفَةُ: وَما الَّذي في القِدْرِ؟",
 "قالَتْ: ماءٌ أُسْكِتُهُمْ بِهِ حَتّى يَناموا.",
 "خَرَجَ الخَليفَةُ مُسْرِعاً وذَهَبَ إلى بَيْتِهِ ، وحَمَلَ سَمْناً وكيساً مِنَ الطَّحينِ ، ورَجَعَ إلى المَرْأَةِ ، ثُمَّ جَلَسَ ووَضَعَ مِقْداراً مِنَ الطَّحينِ ، وقَليلاً مِنَ السَّمْنِ في القِدْرِ ، وأَعَدَّ طَعاماً لِلأَطْفالِ وأَطْعَمَهُمْ.",
 "شَبِعَ الأَطْفالُ وفَرِحوا ونامُوا وخَرَجَ الخَليفَةُ مَسْروراً لِفَرَحِهِمْ."
 ],
 w:[["يَتَفَقَّدُ","يَسْأَلُ عَنْ أَحْوالِ النّاسِ وأُمورِهِمْ"],["سَمْناً","دُهْناً"],["مِقْداراً","كَمِّيَّةً"],["أَعَدَّ طَعاماً","أَحْضَرَ طَعاماً"]]},

{id:"dua",t:"دُعاءُ تِلْميذٍ",k:"poem",p:[43],ill:43,
 tx:[
 "يا إِلهي يا إِلهي ، يا مُجيبَ الدَّعَواتِ",
 "اجْعَلِ اليَوْمَ سَعيداً ، وكَثيرَ البَرَكاتِ",
 "وأَعِنِّي في دُروسي ، وأَداءِ الواجِباتِ",
 "وأَنِرْ عَقْلي وقَلْبي ، بِالعُلومِ النّافِعاتِ",
 "واحْمِني واحْمِ بِلادي ، مِنْ شُرورِ الحادِثاتِ"
 ]}
);
// batch 6: pages 44-48
LS.push(
{id:"summer",t:"فَصْلُ الصَّيْفِ",k:"expr",p:[44],
 tx:[
 "الجَوُّ حارٌّ في فَصْلِ الصَّيْفِ.",
 "يَكونُ فيهِ اللَّيْلُ أَقْصَرَ مِنَ النَّهارِ.",
 "يَذْهَبُ النّاسُ إلى المَصايِفِ والمَسابِحِ والمُتَنَزَّهاتِ.",
 "تَكْثُرُ فيهِ الفَواكِهُ والخُضْراواتُ ، وتُعَطَّلُ المَدارِسُ.",
 "مُدَّةُ الصَّيْفِ ثَلاثَةُ أَشْهُرٍ تَبْدَأُ في شَهْرِ حَزيرانَ.",
 "ويَلْبَسونَ المَلابِسَ الخَفيفَةَ."
 ],
 khat:"رِضا اللَّهِ في رِضا الوالِدَيْنِ وسَخَطُهُ مِنْ سَخَطِهِما."},

{id:"rooster",t:"الدّيكُ والثَّعْلَبُ الماكِرُ",k:"lesson",p:[45,46,47,48],ill:45,
 tx:[
 "رَأى ثَعْلَبٌ دِيكاً يَقِفُ على غُصْنِ شَجَرَةٍ ، فَفَكَّرَ في حيلَةٍ لِيَأْكُلَهُ.",
 "وَقَفَ الثَّعْلَبُ تَحْتَ الشَّجَرَةِ ، وقالَ لِلدّيكِ: مَرْحَباً يا صَديقي. لَقَدْ تُبْتُ فَلَنْ آكُلَ الدَّجاجَ ، أُريدُ أَنْ أَسْمَعَ صَوْتَكَ الجَميلَ ، انْزِلْ والْعَبْ مَعي.",
 "قالَ الدّيكُ: أَيُّها المُحْتالُ تُريدُ أَنْ تَأْكُلَني. كَيْفَ أُصَدِّقُكَ وأَنْتَ عَدُوّي؟",
 "قالَ الثَّعْلَبُ: هَلْ سَمِعْتَ الخَبَرَ الجَديدَ؟",
 "قالَ الدّيكُ: وَما الخَبَرُ الجَديدُ؟",
 "قالَ الثَّعْلَبُ: اتَّفَقَتْ حَيَواناتُ الغابَةِ أَنْ تَعيشَ بِلا عِراكٍ. الكَلْبُ لا يُطارِدُ القِطَّ ، والقِطُّ لا يَأْكُلُ الفَأْرَ ، والذِّئْبُ لا يُؤْذي الغَنَمَ ، والثَّعْلَبُ لا يُعادي الدَّجاجَ.",
 "قالَ الدّيكُ: هذا كَلامٌ جَميلٌ. سَأُنادي كِلابَ القَرْيَةِ لِتَلْعَبَ مَعَنا. صاحَ الدّيكُ وجاءَتِ الكِلابُ تَرْكُضُ. فَسَمِعَ الثَّعْلَبُ الماكِرُ نُباحَ الكِلابِ فَوَلّى هارِباً."
 ],
 w:[["الماكِرُ","المُحْتالُ"],["نُباحٌ","صَوْتُ الكَلْبِ"],["عِراكٌ","قِتالٌ وعَداوَةٌ"],["وَلّى هارِباً","انْهَزَمَ"]]}
);
// batch 7: pages 49-57
LS.push(
{id:"eyes",t:"سَلامَةُ العُيونِ",k:"lesson",p:[49,50,51],ill:49,
 tx:[
 "قالَ عادِلٌ لأُمِّهِ: جاءَتْ طَبيبَةُ العُيونِ إلى مَدْرَسَتِنا اليَوْمَ يا أُمّي.",
 "فَلَمّا دَخَلَتْ صَفَّنا ، وَقَفْنا احْتِراماً لَها ، وقُلْنا بِصَوْتٍ واحِدٍ: أَهْلاً بِالزّائِرَةِ الكَريمَةِ. فَرَدَّتْ عَلَيْنا وقالَتْ: شُكْراً لَكُمْ أَحِبّائي ، جِئْتُ أَفْحَصُ عُيونَكُمْ.",
 "قالَتْ أُمُّ عادِلٍ: وماذا فَعَلَتْ مَعَكُمُ الطَّبيبَةُ؟",
 "قالَ عادِلٌ: فَحَصَتْ عُيونَ التَّلاميذِ واحِداً واحِداً.",
 "وقَبْلَ أَنْ تُغادِرَ صَفَّنا أَوْصَتْنا وقالَتْ: عُيونُكُمْ سَليمَةٌ والحَمْدُ لِلَّهِ ، اغْسِلوا عُيونَكُمْ بِماءٍ نَظيفٍ كُلَّ يَوْمٍ ، واطْرُدوا الذُّبابَ مِنْ بُيوتِكُمْ ، وَلا تَلْعَبوا بِالتُّرابِ ، وإِذا شَعَرْتُمْ بِمَرَضٍ في عُيونِكُمْ ، فَأَسْرِعوا إلى الطَّبيبِ ، وتَذَكَّروا دائِماً أَنَّ الوِقايَةَ خَيْرٌ مِنَ العِلاجِ."
 ]},

{id:"health",t:"المِهَنُ الصِّحِّيَّةُ (الطَّبيبُ والمُمَرِّضُ)",k:"expr",p:[52],
 tx:[
 "إِذا مَرِضْنا نَذْهَبُ إلى المُسْتَشْفى.",
 "في المُسْتَشْفى أَطِبّاءُ ، وفيها مُمَرِّضونَ ومُمَرِّضاتٌ.",
 "الطَّبيبُ يُعالِجُ المَرْضى ، يُساعِدُهُ المُمَرِّضونَ والمُمَرِّضاتُ.",
 "أَنا أُحِبُّ الطَّبيبَ ، وأُحِبُّ المُمَرِّضينَ والمُمَرِّضاتِ.",
 "أَنا أُطيعُ وَصايا الطَّبيبِ ، في تَناوُلِ الدَّواءِ.",
 "الرّازي وابْنُ سينا وابْنُ النَّفيسِ مِنَ الأَطِبّاءِ العَرَبِ القُدامى."
 ],
 khat:"العَيْنُ أَغْلى عُضْوٍ في الجِسْمِ أُحافِظُ على نَظافَتِها."},

{id:"eid",t:"العيدُ",k:"lesson",p:[53,54,55],ill:54,
 tx:[
 "أَحْمَدُ: أَنا أُحِبُّ العيدَ ، وأُخْتي فاطِمَةُ تُحِبُّ العيدَ.",
 "فاطِمَةُ: كُلُّنا نَفْرَحُ بِالعيدِ.",
 "الأُمُّ: نَلْبَسُ المَلابِسَ النَّظيفَةَ والجَميلَةَ في العيدِ.",
 "أَحْمَدُ: عِنْدي ثِيابٌ نَظيفَةٌ وجَميلَةٌ.",
 "فاطِمَةُ: وأَنا عِنْدي ثِيابٌ نَظيفَةٌ وجَميلَةٌ.",
 "الأَبُ: غَداً يَوْمُ العيدِ. نَفْرَحُ بِزِيارَةِ أَقارِبِنا وجيرانِنا وأَصْدِقائِنا ونَذْهَبُ إلى المَلاعِبِ والحَدائِقِ.",
 "اسْتَيْقَظَ أَحْمَدُ مُبَكِّراً في صَباحِ يَوْمِ العيدِ ، ولَبِسَ مَلابِسَ العيدِ ، واسْتَيْقَظَتْ فاطِمَةُ مُبَكِّرَةً ولَبِسَتْ مَلابِسَ العيدِ.",
 "فاطِمَةُ: عيدُكَ مُبارَكٌ يا أَحْمَدُ. كُلُّ عامٍ وأَنْتَ بِخَيْرٍ.",
 "أَحْمَدُ: عيدُكِ مُبارَكٌ يا فاطِمَةُ. كُلُّ عامٍ وأَنْتِ بِخَيْرٍ.",
 "ذَهَبَ الاثْنانِ إلى الأَبِ والأُمِّ وقَبَّلاهُما وقالا لَهُما: عيدُكَ مُبارَكٌ يا أَبي. عيدُكِ مُبارَكٌ يا أُمّي ، وفَرِحَ الجَميعُ."
 ],
 khat:"أُقَبِّلُ والِدَيَّ يَوْمَ العيدِ وأَقولُ لَهُما: عيدٌ سَعيدٌ."},

{id:"eidpoem",t:"يَوْمُ العيدِ",k:"poem",p:[56],ill:56,
 tx:[
 "خَرَجْتُ يَوْمَ العيدِ ، بِمَلْبَسي الجَديدِ",
 "أَدْعو لَكُمْ إِخْواني ، بِأَجْمَلِ الأَماني",
 "هَيّا مَعي لِنَذْهَبْ ، ثُمَّ جَميعاً نَلْعَبْ",
 "فَيَوْمُنا جَميلُ ، وكُلُّنا نَقولُ",
 "نَحْنُ نُحِبُّ العيدا ، نُحِبُّ أَنْ يَعودا",
 "فَكُلُّهُ جَمالُ ، يُحِبُّهُ الأَطْفالُ"
 ]},

{id:"autumn",t:"فَصْلُ الخَريفِ",k:"expr",p:[57],
 tx:[
 "فَصْلُ الخَريفِ جَميلٌ ، تَكْثُرُ فيهِ الغُيومُ ، وتَهُبُّ الرِّياحُ الخَفيفَةُ ، وتَصْفَرُّ أَوْراقُ الأَشْجارِ.",
 "يَميلُ الجَوُّ إلى البُرودَةِ ، والهَواءُ لَطيفٌ يَبْعَثُ على النَّشاطِ.",
 "تَسْقُطُ فيهِ أَمْطارٌ خَفيفَةٌ ، ويَكونُ الجَوُّ جَميلاً.",
 "يَبْدَأُ فَصْلُ الخَريفِ في شَهْرِ أَيْلولَ ومُدَّتُهُ ثَلاثَةُ أَشْهُرٍ.",
 "نَرى فيهِ أَوْراقَ الأَشْجارِ تُغَطّي الأَرْضَ ، والتُّرابَ رَطْباً.",
 "يُعِدُّ الفَلّاحونَ أَرْضَهُمْ لِلزِّراعَةِ."
 ],
 khat:"أَنا أُحِبُّ الشِّتاءَ والرَّبيعَ والصَّيْفَ والخَريفَ."}
);
// batch 8: pages 58-67
LS.push(
{id:"neighbors",t:"الجيرانُ",k:"lesson",p:[58,59,60],ill:58,
 tx:[
 "جَلَسَ عَدْنانُ مَعَ أَبيهِ يُحَدِّثُهُ عَنِ الجارِ الجَديدِ.",
 "قالَ عَدْنانُ: سَكَنَتْ أُسْرَةٌ بِجِوارِنا اليَوْمَ .. يا أَبي.",
 "الأَبُ: وكَيْفَ عَرَفْتَ ذلِكَ؟",
 "عَدْنانُ: ساعَدْتُ الأُسْرَةَ على حَمْلِ الأَثاثِ.",
 "الأَبُ: أَحْسَنْتَ يا عَدْنانُ .. هذا واجِبٌ. إِنَّ لِلْجارِ حُقوقاً على جارِهِ.",
 "الأُمُّ: عَلَيْنا أَنْ نُقَدِّمَ إلى الجارِ الجَديدِ وَجْبَةَ العَشاءِ.",
 "الأَبُ: يَجِبُ أَنْ نَتَعَرَّفَ إلى أَفْرادِ الأُسْرَةِ ، ونَزورَها في الأُسْبوعِ القادِمِ ، إِنْ شاءَ اللَّهُ.",
 "عَدْنانُ: إِنَّهُمْ أَرْبَعَةٌ .. يا أَبي. فُؤادٌ ومَرْيَمُ والأَبُ والأُمُّ.",
 "سَلْمى: أَنا فَرِحَةٌ بِجيرانِنا ، سَأَلْعَبُ مَعَ ابْنَتِهِمْ مَرْيَمَ.",
 "عَدْنانُ: أَنا سَأَلْعَبُ مَعَ ابْنِهِمْ فُؤادٍ.",
 "الأُمُّ: حافِظا على الهُدوءِ ، ولا تُزْعِجا الجيرانَ.",
 "أَوْصى النَّبِيُّ مُحَمَّدٌ ﷺ بِالجارِ وقالَ: (خَيْرُ الجيرانِ عِنْدَ اللَّهِ خَيْرُهُمْ لِجارِهِ)",
 "الأَبُ: وقالَ الإِمامُ عَلِيٌّ عَلَيْهِ السَّلامُ: (سَلْ عَنِ الجارِ قَبْلَ الدّارِ)."
 ]},

{id:"ducks",t:"بَطَّتانِ وسُلَحْفاةٌ",k:"lesson",p:[61,62,63,64],ill:62,
 tx:[
 "سَكَنَتْ بَطَّتانِ في غَديرٍ ، وسَكَنَتْ مَعَهُما سُلَحْفاةٌ ، وأَصْبَحَتِ السُّلَحْفاةُ صَديقَةً لِلْبَطَّتَيْنِ ، تَزورُهُما كُلَّ يَوْمٍ ، فَيَقْضي الثَّلاثَةُ وَقْتاً جَميلاً في الحَديثِ والسَّمَرِ بِالقُرْبِ مِنَ الغَديرِ.",
 "وبَعْدَ مُدَّةٍ مِنَ الزَّمَنِ جَفَّ ماءُ الغَديرِ ، وأَرادَتِ البَطَّتانِ أَنْ تُغادِرا المَكانَ وتَذْهَبا إلى غَديرٍ آخَرَ فيهِ ماءٌ كَثيرٌ.",
 "جاءَتِ البَطَّتانِ لِوَداعِ السُّلَحْفاةِ ، وقالَتا: السَّلامُ عَلَيْكِ ، فَإِنَّنا ذاهِبَتانِ إلى غَديرٍ آخَرَ.",
 "قالَتِ السُّلَحْفاةُ: أَنا لا أَقْدِرُ على العَيْشِ إِلّا في الماءِ ، فَخُذاني مَعَكُما ولا تَتْرُكاني وَحيدَةً.",
 "فَكَّرَتِ البَطَّتانِ وقالَتا: السُّلَحْفاةُ لا تَقْدِرُ على الطَّيَرانِ ، فَكَيْفَ السَّبيلُ إلى حَمْلِها؟",
 "أَحْضَرَتِ البَطَّتانِ عَصاً ، وأَمْسَكَتْ كُلُّ واحِدَةٍ مِنْهُما طَرَفاً بِمِنْقارِها ، وطَلَبَتا مِنَ السُّلَحْفاةِ أَنْ تَتَعَلَّقَ في وَسَطِ العَصا وقالَتا لَها: لا تَخافي أَيَّتُها الصَّديقَةُ ، سَنَطيرُ بِكِ إلى غَديرٍ آخَرَ. امْسِكي بِالعَصا جَيِّداً بِفَمِكِ ، ولا تَتَكَلَّمي في أَثْناءِ السَّفَرِ فَتَقَعي وتَموتي.",
 "شاهَدَ بَعْضُ النّاسِ البَطَّتَيْنِ تَحْمِلانِ السُّلَحْفاةَ فَقالوا: عَجَبٌ .. عَجَبٌ ، بَطَّتانِ تَحْمِلانِ سُلَحْفاةً!",
 "أَرادَتِ السُّلَحْفاةُ أَنْ تَتَكَلَّمَ ، لكِنَّها تَذَكَّرَتْ نَصيحَةَ البَطَّتَيْنِ فَسَكَتَتْ ، وبَقِيَتْ ساكِتَةً لا تَتَكَلَّمُ إلى أَنْ وَصَلَ الثَّلاثَةُ إلى غَديرٍ فيهِ ماءٌ.",
 "شَكَرَتِ السُّلَحْفاةُ البَطَّتَيْنِ على مَعْروفِهِما وعاشَتْ مَعَهُما في الغَديرِ الجَديدِ سَعيدَةً."
 ],
 w:[["الغَديرُ","بُقْعَةٌ يَجْتَمِعُ فيها الماءُ"],["تُغادِرُ","تَتْرُكُ"],["السَّبيلُ","الطَّريقَةُ"],["السَّمَرُ","الحَديثُ لَيْلاً"],["جَفَّ","يَبِسَ"],["مَعْروفُهُما","إِحْسانُهُما ، عَمَلُ الجَميلِ"]],
 khat:"أَنا أَعْمَلُ دائِماً بِنَصائِحِ أُمّي وأَبي ومُعَلِّمَتي."},

{id:"police",t:"شُرْطِيُّ المُرورِ",k:"expr",p:[65],
 tx:[
 "شُرْطِيُّ المُرورِ يُنَظِّمُ سَيْرَ السَّيّاراتِ.",
 "يُساعِدُ النّاسَ على عُبورِ الشّارِعِ.",
 "نَعْبُرُ الشّارِعَ مِنْ مَناطِقِ العُبورِ.",
 "أُحِبُّ فِرْقَةَ السَّلامَةِ المُرورِيَّةِ في مَدْرَسَتِنا.",
 "لأَنَّها تُساعِدُنا على عُبورِ الشّارِعِ بِأَمانٍ ، وأُحِبُّ شُرْطِيَّ المُرورِ."
 ],
 khat:"أُحِبُّ النِّظامَ وأَعْبُرُ مِنْ مَناطِقِ العُبورِ."},

{id:"bread",t:"الخُبْزُ",k:"lesson",p:[66,67,68],ill:66,
 tx:[
 "طَلَبَ صَبِيٌّ خُبْزاً مِنْ رَجُلٍ.",
 "فَطَلَبَ الرَّجُلُ الخُبْزَ مِنَ الخَبّازِ.",
 "فَطَلَبَ الخَبّازُ طَحيناً مِنَ التّاجِرِ.",
 "فَطَلَبَ التّاجِرُ الطَّحينَ مِنْ طَحّانٍ.",
 "فَطَلَبَ الطَّحّانُ حِنْطَةً مِنْ فَلّاحٍ.",
 "فَزَرَعَ الفَلّاحُ زَرْعاً.",
 "فَأَخْرَجَ الزَّرْعُ حِنْطَةً.",
 "باعَ الفَلّاحُ الحِنْطَةَ لِلطَّحّانِ.",
 "فَطَحَنَ الطَّحّانُ الحِنْطَةَ فَصارَتْ طَحيناً.",
 "فَباعَ الطَّحّانُ الطَّحينَ لِلتّاجِرِ.",
 "وباعَ التّاجِرُ الطَّحينَ لِلخَبّازِ.",
 "فَجَعَلَ الخَبّازُ الطَّحينَ عَجيناً ، وخَبَزَهُ فَصارَ خُبْزاً.",
 "فَباعَ الخَبّازُ الخُبْزَ لِلرَّجُلِ.",
 "فَأَعْطى الرَّجُلُ الخُبْزَ لِلوَلَدِ.",
 "أَخَذَ الوَلَدُ الخُبْزَ فَأَكَلَهُ وقالَ: الحَمْدُ لِلَّهِ رَبِّ العالَمينَ."
 ],
 khat:"مَنْ جَدَّ وَجَدَ ومَنْ زَرَعَ حَصَدَ."}
);
// batch 9: pages 69-74
LS.push(
{id:"garden",t:"حَديقَتي",k:"poem",p:[70],ill:70,
 tx:[
 "حَديقَتي جَميلَةْ ، كَأَنَّها خَميلَةْ",
 "فيها زُهورُ الزّينَةْ ، تَزْهو بِها المَدينَةْ",
 "والوَرْدُ لَيْلاً فَتَّحْ ، بِعِطْرِهِ وأَصْبَحْ",
 "والزَّهْرُ حُلْوٌ فيها ، وطيبُهُ يُحْييها",
 "فيها نَرى الأَماني ، وأَجْمَلَ المَعاني"
 ]},

{id:"publicgarden",t:"الحَديقَةُ العامَّةُ",k:"expr",p:[71],
 tx:[
 "الحَديقَةُ العامَّةُ هِيَ مِلْكٌ لِلجَميعِ.",
 "يَزْرَعُ الفَلّاحُ الأَشْجارَ الدّائِمَةَ الخُضْرَةِ في الحَديقَةِ العامَّةِ لِكَيْ تُلَطِّفَ الجَوَّ فَتَطْرَحَ الأُوكْسُجينَ وتَأْخُذَ ثاني أُوكْسيدِ الكاربونِ.",
 "ويَزْرَعُ الوُرودَ المُلَوَّنَةَ ، فَما أَجْمَلَها وَهِيَ في الحَديقَةِ تَزْهو.",
 "الفَلّاحُ يَزْرَعُها ويَهْتَمُّ بِها لِكَيْ تَبْهَجَ النَّظَرَ وتُمْتِعَ النُّفوسَ.",
 "نَحْنُ نُحافِظُ على الحَديقَةِ العامَّةِ لأَنَّ فائِدَتَها لِلجَميعِ ولَيْسَ لِفَرْدٍ واحِدٍ."
 ],
 khat:"لِنَجْعَلَ مِنْ أَرْضِنا مَزْرَعَةً خَضْراءَ وجَنَّةً فَيْحاءَ."},

{id:"oxdonkey",t:"الحِمارُ والثَّوْرُ",k:"lesson",p:[72,73,74],ill:72,
 tx:[
 "كانَ لِفَلّاحٍ حِمارٌ وثَوْرٌ.",
 "وكانَ الفَلّاحُ يَرْكَبُ الحِمارَ مَرَّةً في الأُسْبوعِ لِيَذْهَبَ إلى سوقِ المَدينَةِ ، ويَأْخُذُ الثَّوْرَ إلى الحَقْلِ لِيَحْرُثَ الأَرْضَ كُلَّ يَوْمٍ.",
 "وفي أَحَدِ الأَيّامِ قالَ الثَّوْرُ لِلحِمارِ: لَقَدْ تَعِبْتُ كَثيراً. إلى مَتى أَعْمَلُ في الحِراثَةِ؟",
 "قالَ الحِمارُ: تَمارَضْ ، ولا تَأْكُلْ عَلَفَكَ. فَإِذا رَآكَ الفَلّاحُ على هذِهِ الحالِ تَرَكَكَ ولَمْ يَأْخُذْكَ لِلحِراثَةِ.",
 "وفي صَباحِ اليَوْمِ الثّاني جاءَ الفَلّاحُ فَوَجَدَ الثَّوْرَ نائِماً لَمْ يَأْكُلِ العَلَفَ فَتَرَكَهُ وأَخَذَ الحِمارَ إلى الحَقْلِ وحَرَثَ عَلَيْهِ طولَ اليَوْمِ فَتَعِبَ الحِمارُ تَعَباً شَديداً ، ونَدِمَ على ما قالَهُ لِلثَّوْرِ.",
 "وفي المَساءِ عادَ الحِمارُ مِنَ الحَقْلِ فَسَأَلَهُ الثَّوْرُ: كَيْفَ حالُكَ يا أَخي؟",
 "قالَ الحِمارُ: أَنا بِخَيْرٍ ، غَيْرَ أَنِّي سَمِعْتُ الفَلّاحَ يَقولُ لِزَوْجَتِهِ: إِذا بَقِيَ الثَّوْرُ مَريضاً ، بِعْتُهُ على الجَزّارِ قَبْلَ أَنْ يَموتَ فَأَخْسَرَ ثَمَنَهُ.",
 "خافَ الثَّوْرُ. فَنَهَضَ وأَكَلَ عَلَفَهُ. وفي الصَّباحِ جاءَ الفَلّاحُ وأَخَذَهُ إلى الحَقْلِ ، فَمَشى الثَّوْرُ بِنَشاطٍ."
 ],
 w:[["تَمارَضْ","تَظاهَرْ بِأَنَّكَ مَريضٌ"],["نَدِمَ","تَأَسَّفَ ولامَ نَفْسَهُ"]]},

{id:"library1",t:"مَكْتَبَةُ المَدْرَسَةِ",k:"lesson",p:[75,76,77,78],ill:75,
 tx:[
 "في يَدِ المُعَلِّمَةِ كِتابٌ صَغيرٌ.",
 "قالَ التَّلاميذُ: هذا كِتابٌ جَميلٌ. فيهِ صُوَرٌ جَميلَةٌ.",
 "قالَتِ المُعَلِّمَةُ: في الكِتابِ قِصَصٌ لَطيفَةٌ.",
 "قالَ التَّلاميذُ: أَيْنَ نَجِدُ مِثْلَ هذا الكِتابِ؟",
 "قالَتِ المُعَلِّمَةُ: هذا الكِتابُ مِنْ مَكْتَبَةِ المَدْرَسَةِ.",
 "في المَكْتَبَةِ كُتُبٌ كَثيرَةٌ. فيها قِصَصٌ وحِكاياتٌ لَطيفَةٌ وصُوَرٌ جَميلَةٌ.",
 "قالَ التَّلاميذُ: نُريدُ أَنْ نَزورَ المَكْتَبَةَ ، ونَقْرَأَ القِصَصَ والحِكاياتِ.",
 "نَحْنُ نُحِبُّ المَكْتَبَةَ ونُحافِظُ على كُتُبِها.",
 "ذَهَبَ التَّلاميذُ إلى مَكْتَبَةِ المَدْرَسَةِ.",
 "قالَتِ المُعَلِّمَةُ: كُلُّ واحِدٍ يَأْخُذُ كِتاباً. هذِهِ كُتُبٌ مُفيدَةٌ. فيها قِصَصٌ وحِكاياتٌ.",
 "فيها قِصَّةُ الحَمامَةِ والأَوْلادِ ، وقِصَّةُ الغُرابِ الذَّكِيِّ ، وقِصَّةُ الذِّئْبِ والخَرُوفِ ، وغَيْرُها.",
 "وحافِظوا على نَظافَةِ الكُتُبِ ، اجْلِسوا بِنِظامٍ وطالِعوا بِهُدوءٍ. أَنْتُمْ مِنْ أَصْدِقاءِ المَكْتَبَةِ."
 ],
 khat:"وخَيْرُ جَليسٍ في الزَّمانِ كِتابُ."}
);

LS.push(
{id:"bookpoem",t:"الكِتابُ",k:"poem",p:[80],ill:80,
 tx:[
 "أَنا فَتىً ذو أَدَبْ ، أَقْرَأُ خَيْرَ الكُتُبْ",

 ]},

{id:"animals2",t:"الحَيَواناتُ الأَليفَةُ والمُفْتَرِسَةُ",k:"expr",p:[81],
 tx:[
 "البَقَرَةُ والخَروفُ والماعِزُ والجَمَلُ مِنَ الحَيَواناتِ الأَليفَةِ. تَعيشُ في الحَظائِرِ والبُيوتِ والمَزارِعِ.",
 "نُرَبّيها ونَأْخُذُ مِنْها الحَليبَ والصُّوفَ واللَّحْمَ والجُلودَ.",
 "الحِصانُ والحِمارُ والبَغْلُ مِنَ الحَيَواناتِ الأَليفَةِ ، نَرْكَبُها ونَحْمِلُ عَلَيْها الأَثْقالَ.",
 "الحَيَواناتُ المُفْتَرِسَةُ تَعيشُ في الغاباتِ والوِدْيانِ والبَراري. نَبْتَعِدُ عَنْها لأَنَّها تُؤْذينا.",
 "مِثْلُ الأَسَدِ ، والذِّئْبِ ، والنَّمِرِ ، والدُّبِّ ، والضَّبُعِ."
 ],
 khat:"أَنا أُحِبُّ جَدّي وأُحِبُّ جَدَّتي وأَرْعاهُما."},

{id:"rabbit",t:"الأَرْنَبُ والصُّوصُ كوكو",k:"lesson",p:[82,83,84,85,86,87],ill:82,
 tx:[
 "باضَتِ الدَّجاجَةُ أُمُّ كوكو عَشْرَ بَيْضاتٍ ، وحَضَنَتِ البَيْضَ ، ورَقَدَتْ عَلَيْهِ واحِداً وعِشْرينَ يَوْماً ، وانْتَظَرَتْ حَتّى يَفْقِسَ البَيْضُ.",
 "خَرَجَتِ الدَّجاجَةُ تُفَتِّشُ عَنِ الطَّعامِ ، فَجاءَ أَرْنَبٌ صَغيرٌ يَلْعَبُ بِالكُرَةِ فَوَقَعَتِ الكُرَةُ على بَيْضِ الدَّجاجَةِ ، فَتَدَحْرَجَتْ بَيْضَةٌ في القَشِّ ، بَعيداً مِنَ البَيْضاتِ التِّسْعِ ، وسَمِعَ الأَرْنَبُ صَوْتَ قِشْرَةِ البَيْضَةِ تَتَكَسَّرُ ، فَاقْتَرَبَ مِنْها ورَأى فَرْخاً صَغيراً يَخْرُجُ مِنَ البَيْضَةِ ، ويَصيحُ: أُمّي ... أُمّي ، أَيْنَ أُمّي؟ أُريدُ أُمّي!",
 "فَسَأَلَهُ الأَرْنَبُ الصَّغيرُ: مَنْ أَنْتَ؟ تَعالَ نَلْعَبْ بِالكُرَةِ.",
 "رَفْرَفَ الفَرْخُ بِجَناحَيْهِ الصَّغيرَيْنِ وصاحَ: أَنا الصّوصُ كوكو. أَيْنَ أُمّي؟ أُريدُ أُمّي.",
 "وأَخَذَ يَمْسَحُ ريشَهُ بِفِراءِ الأَرْنَبِ النّاعِمِ ، فَفَرِحَ الأَرْنَبُ بِصَديقِهِ الجَديدِ.",
 "كانَتِ الدَّجاجَةُ تَبْكي على بَيْضَتِها ، فَسَمِعَ الدّيكُ بُكاءَها وصاحَ على الكَلْبِ وقالَ: هَيّا نَبْحَثْ عَنِ البَيْضَةِ.",
 "نَبَحَ الكَلْبُ وقالَ لِلحِصانِ: هَيّا نَبْحَثْ عَنْ بَيْضَةِ أُمِّ كوكو.",
 "صَهَلَ الحِصانُ وقالَ لِلحِمارِ: تَعالَ مَعي نَبْحَثْ عَنِ البَيْضَةِ.",
 "نَهَقَ الحِمارُ وقالَ: هَيّا بِنا ، أَسْرِعوا نَبْحَثْ عَنِ البَيْضَةِ.",
 "مَرَّ الدّيكُ بِالأَرْنَبِ مُسْرِعاً ، فَقالَ لَهُ الأَرْنَبُ: عَلامَ تَرْكُضُ يا صَديقي؟ تَعالَ نَلْعَبْ مَعاً. أَنا وأَنْتَ وصَديقي الصّوصُ كوكو.",
 "قالَ الدّيكُ بِصَوْتٍ حَزينٍ: لَقَدْ ضاعَتْ بَيْضَةُ الدَّجاجَةِ أُمِّ كوكو."
 ]}
);
// batch 11: pages 85-92
LS.find(x=>x.id=="rabbit").tx.push(
 "وأَنا الآنَ أَبْحَثُ عَنْها.",
 "جاءَ الكَلْبُ والحِصانُ والحِمارُ فَوَقَفوا يَنْظُرونَ إلى الأَرْنَبِ والدّيكِ والصّوصِ.",
 "وجاءَتِ الدَّجاجَةُ مُسْرِعَةً تَصيحُ بِلَهْفَةٍ: فَرْخي .. فَرْخي ، حَبيبي كوكو. أَيْنَ وَجَدْتُموهُ؟",
 "واحْتَضَنَتِ الصّوصَ وسَأَلَتِ الدّيكَ: لِماذا لَمْ تُخْبِرْني بِأَنَّكُمْ وَجَدْتُمْ فَرْخي؟",
 "فَأَجابَ الدّيكُ مُسْتَغْرِباً: كُنّا نَبْحَثُ عَنْ بَيْضَتِكِ ، لا عَنْ فَرْخِكِ!",
 "قالَتِ الدَّجاجَةُ: شُكْراً لَكُمْ جَميعاً يا أَصْدِقائي."
);
LS.push(
{id:"kite",t:"الطَّيّارَةُ الوَرَقِيَّةُ",k:"lesson",p:[88,89,90],ill:88,
 tx:[
 "أَحْضَرَ سَعيدٌ وَرَقَةً كَبيرَةً على شَكْلِ مُرَبَّعٍ وشَرائِطَ مُلَوَّنَةً وأَعْطَتْهُ أُمُّهُ خَيْطاً طَويلاً لَفَّهُ على أُنْبوبٍ قَصيرٍ.",
 "ثُمَّ أَحْضَرَ قَليلاً مِنَ الصَّمْغِ ، وطَلَبَ إلى أَخيهِ الكَبيرِ أَنْ يُساعِدَهُ على صُنْعِ طَيّارَةٍ مِنَ الوَرَقِ ، لِيَلْعَبَ بِها مَعَ أَصْدِقائِهِ.",
 "فَرِحَ سَعيدٌ بِطَيّارَتِهِ الجَميلَةِ ، فَسَأَلَ أَخاهُ قائِلاً: كَيْفَ تَطيرُ الطَّيّارَةُ يا أَخي؟",
 "قالَ لَهُ أَخوهُ: عِنْدَما نَرْبِطُ الوَرَقَةَ بِالخَيْطِ مِنْ وَسَطِها ، نَسْحَبُ الخَيْطَ ونَرْكُضُ فَيَتَحَرَّكُ الهَواءُ ، ويَدْفَعُ الوَرَقَةَ مِنْ أَسْفَلِها. وكُلَّما زادَتْ سُرْعَتُنا في الرَّكْضِ زادَتْ حَرَكَةُ الهَواءِ ، ورَفَعَ الطَّيّارَةَ إلى الأَعْلى شَيْئاً فَشَيْئاً ، حَتّى نَراها تُحَلِّقُ في الفَضاءِ كَما تُحَلِّقُ الطُّيورُ.",
 "قالَ سَعيدٌ: ولِماذا نَعْمَلُ ذَيْلاً لَها؟",
 "قالَ أَخوهُ: إِنَّ الذَّيْلَ يُساعِدُ الطَّيّارَةَ على التَّوازُنِ.",
 "قالَ سَعيدٌ: لَقَدْ ساعَدْتَني في صُنْعِ طَيّارَتي ، وعَلَّمْتَني كَيْفَ تَطيرُ فَشُكْراً لَكَ."
 ]},

{id:"builder",t:"المِعْمارُ الصَّغيرُ",k:"poem",p:[91],ill:91,
 tx:[
 "لي قِطَعٌ مِنْ خَشَبْ ، أَلْهو بِها في اللَّعِبْ",
 "أَصُفُّها .. فَتَنْتَظِمْ ، ثُمَّ جَميعاً .. تَنْهَدِمْ",
 "هَيّا انْظُروا بِنائي ، فَتَعْرِفوا ذَكائي",
 "أَبْني لَكُمْ بَيْتَ الهَنا ، هَلْ تَعْرِفونَ مَنْ أَنا",
 "إِنّي أَنا المِعْمارُ ، صَفِّقوا .. يا صِغارُ"
 ]},

{id:"birds",t:"الطُّيورُ",k:"expr",p:[92],
 tx:[
 "الحَمامُ والدَّجاجُ والإوَزُّ والبَطُّ مِنَ الطُّيورِ الأَليفَةِ. تُعْطينا البَيْضَ واللَّحْمَ والرّيشَ.",
 "وتوجَدُ طُيورٌ مائِيَّةٌ مِثْلُ البَطِّ والإوَزِّ واللَّقْلَقِ ومالِكِ الحَزينِ ، تَعيشُ في الأَنْهارِ والبُحَيْراتِ والأَهْوارِ.",
 "العَصافيرُ والبَلابِلُ تَعيشُ في البَساتينِ والمَزارِعِ ، تُغَرِّدُ وتُزَقْزِقُ وتَبْني أَعْشاشَها على الأَشْجارِ.",
 "وتوجَدُ طُيورٌ جارِحَةٌ مِثْلُ النَّسْرِ والبومِ والصَّقْرِ ، تَعيشُ في كُهوفِ الجِبالِ والغاباتِ والخَرائِبِ."
 ],
 khat:"كُلُّ القُرى والمُدُنِ في بِلادِنا جَميلَةٌ."}
);
// batch 12: pages 93-99
LS.push(
{id:"bear",t:"نَظّاراتُ الدُّبِّ أَبي فَهْدٍ",k:"lesson",p:[93,94,95,96,97,98],ill:93,
 tx:[
 "جاءَتِ الدَّجاجَةُ الصَّغيرَةُ ، تَرْكُضُ بِرِجْلَيْها الصَّغيرَتَيْنِ ، إلى بَيْتِ العَمِّ الدُّبِّ أَبي فَهْدٍ ، وطَرَقَتِ البابَ ونادَتْ:",
 "يا عَمّي يا أَبا فَهْدٍ ، هَلْ تُريدُ أَنْ تَخْرُجَ لِلنُّزْهَةِ في الغابَةِ؟ في الغابَةِ أَشْجارٌ وحَيَواناتٌ وطُيورٌ كَثيرَةٌ.",
 "فَفَتَحَ العَمُّ الدُّبُّ أَبو فَهْدٍ البابَ قَليلاً ، وهَزَّ رَأْسَهُ وقالَ: يا أَيَّتُها الدَّجاجَةُ ، لا أَقْدِرُ أَنْ أَخْرُجَ لِلنُّزْهَةِ ، لأَنَّني ضَيَّعْتُ نَظّاراتي.",
 "قالَتِ الدَّجاجَةُ: لا تَحْزَنْ يا أَبا فَهْدٍ. سَأُفَتِّشُ لَكَ عَنْ نَظّاراتِكَ.",
 "ذَهَبَتِ الدَّجاجَةُ الصَّغيرَةُ ، تَرْكُضُ حَتّى جاءَتْ إلى الدُّبَّةِ أُمِّ غُزَيْلانَ ، وأَوْلادِها الدُّبَيَّةِ الصِّغارِ ، غُزَيْلانَ وكُحَيْلانَ وسُعَيْدانَ.",
 "فَقالَتْ لَهُمْ وهِيَ تَبْكي: لَقَدْ ضَيَّعَ المِسْكينُ أَبو فَهْدٍ نَظّاراتِهِ ، وهُوَ لا يَقْدِرُ بَعْدَ الآنَ على أَنْ يَخْرُجَ مِنْ بَيْتِهِ لِلنُّزْهَةِ.",
 "فَقالَ الدُّبَيَّةُ الثَّلاثَةُ الصِّغارُ كُلُّهُمْ مَرَّةً واحِدَةً: لا تَبْكي يا أَيَّتُها الدَّجاجَةُ. لِنَذْهَبْ فَنُفَتِّشَ عَنْها.",
 "فَذَهَبوا وفَتَّشوا عَنْها هُنا وفَتَّشوا هُناكَ ، وفَتَّشوا في كُلِّ مَكانٍ فَلَمْ يَجِدوها.",
 "فَقالَتْ لَهُمْ أُمُّهُمُ الدُّبَّةُ أُمُّ غُزَيْلانَ: لا تَبْكوا يا أَوْلادي. تَعالَوْا نَذْهَبْ إلى الكَلْبِ حُدَيْدانَ فَلَعَلَّهُ يَقْدِرُ على أَنْ يَجِدَها. ذَهَبَ الجَميعُ إلى الكَلْبِ حُدَيْدانَ فَقالَ: أَنا أُفَتِّشُ عَنْها.",
 "ذَهَبَ الكَلْبُ وفَتَّشَ هُنا ، وفَتَّشَ هُناكَ. وبَعْدَ قَليلٍ رَجَعَ الكَلْبُ يَرْكُضُ ويَصيحُ: وَجَدْتُها ... وَجَدْتُها. رَكَضَ الجَميعُ فَرَأَوُا النَّظّاراتِ في يَدِ حُدَيْدانَ ، فَفَرِحوا فَرَحاً عَظيماً ثُمَّ ذَهَبوا إلى بَيْتِ الدُّبِّ أَبي فَهْدٍ.",
 "فَقامَ الدُّبُّ أَبو فَهْدٍ وفَتَحَ البابَ قَليلاً قَليلاً ، ولَمّا رَأى النَّظّاراتِ قالَ: هذِهِ لَيْسَتْ نَظّاراتي. فَهذِهِ النَّظّاراتُ حُمْرٌ ونَظّاراتي خُضْرٌ.",
 "وبَيْنَما هُمْ واقِفونَ جاءَهُمْ صَبِيٌّ اسْمُهُ حَمْدانُ وسَأَلَهُمْ: ما بِكُمْ؟ فَأَخْبَروهُ بِما جَرى. نَظَرَ الصَّبِيُّ حَمْدانُ إلى الدُّبِّ أَبي فَهْدٍ ، وأَخَذَ يَضْحَكُ بِصَوْتٍ مُرْتَفِعٍ. فَغَضِبوا وقالوا لَهُ: لِماذا تَضْحَكُ؟",
 "فَأَجابَهُمُ الصَّبِيُّ حَمْدانُ قائِلاً: إِنَّ الدُّبَّ أَبا فَهْدٍ لَمْ يُضَيِّعْ نَظّاراتِهِ ، اُنْظُروا إلى رَأْسِهِ تَرَوُا النَّظّاراتِ عَلَيْهِ.",
 "فَمَدَّ العَمُّ الدُّبُّ أَبو فَهْدٍ يَدَهُ إلى رَأْسِهِ فَوَجَدَ نَظّاراتِهِ.",
 "ضَحِكَ الجَميعُ ضَحِكاً عالِياً. ضَحِكوا كُلُّهُمْ على حالِ العَمِّ الدُّبِّ أَبي فَهْدٍ لأَنَّهُ نَسِيَ نَظّاراتِهِ على رَأْسِهِ.",
 "وضَحِكَ العَمُّ الدُّبُّ أَبو فَهْدٍ على حالِهِ ، وخَرَجَ مَعَهُمْ لِلنُّزْهَةِ."
 ],
 khat:"لا نُضَيِّعُ الوَقْتَ بِالتَّفْتيشِ إِذا رَتَّبْنا أَشْياءَنا."},

{id:"dubdoub",t:"دُبْدوبُ والحاسوبُ",k:"poem",p:[99],ill:99,
 tx:[
 "فَكَّرَ دُبْدوبُ المَحْبوبْ ، فَكَّرَ في أَمْرِ الحاسوبْ",
 "راحَ إلى مَكْتَبَةِ الغابَةْ ، كَيْ يَعْرِفَ مِنْها المَطْلوبْ",
 "فَتَصَفَّحَ في كُلِّ كِتابْ ، مِنْ مَرْسومٍ أَوْ مَكْتوبْ",
 "فَتَوَصَّلَ لِلحَلِّ سَريعاً ، دُبْدوبُ الحُلْوُ المَوْهوبْ",
 "لَمّا أَدْرَكَ أَنَّ العالَمَ ، يَبْحَثُ عَنْ شَيْءٍ مَرْغوبْ",
 "عادَ يُحاوِلُ أَنْ يَتَعَلَّمَ ، كَيْفَ اسْتِعْمالُ الحاسوبْ"
 ]},

{id:"senses",t:"الحَواسُّ الخَمْسُ",k:"lesson",p:[100,101,102,103],ill:100,
 tx:[
 "قالَ حَسَنٌ: هذِهِ عَيْني ، بِالعَيْنِ أَسْتَطيعُ أَنْ أُبْصِرَ طَريقي وأَرى كُلَّ شَيْءٍ ، وأَسْتَطيعُ أَنْ أَقْرَأَ وأَكْتُبَ. العَيْنُ حاسَّةُ البَصَرِ.",
 "وصاحَ عادِلٌ: هذِهِ أُذُني. بِالأُذُنِ أَسْمَعُ الأَصْواتَ ، فَأَسْمَعُ كَلامَ النّاسِ ، وأَسْمَعُ الأَناشيدَ والأَغاني الجَميلَةَ. الأُذُنُ حاسَّةُ السَّمْعِ.",
 "قالَتْ هَيْفاءُ: هذا أَنْفي ، بِأَنْفي أَشُمُّ الرَّوائِحَ المُخْتَلِفَةَ ، فَأَشُمُّ رائِحَةَ الوَرْدِ ، ورائِحَةَ الطَّعامِ. الأَنْفُ حاسَّةُ الشَّمِّ.",
 "وصاحَتْ إيمانُ: هذا لِساني ، بِلِساني أَذوقُ الأَشْياءَ ، فَأَعْرِفُ طَعْمَها ، وبِهِ أَعْرِفُ الحُلْوَ والمُرَّ. اللِّسانُ حاسَّةُ الذَّوْقِ.",
 "قالَ هاشِمٌ: هذِهِ يَدي. بِيَدي أَلْمِسُ الأَشْياءَ فَأَعْرِفُ النّاعِمَ والخَشِنَ ، وأَعْرِفُ البارِدَ والسّاخِنَ. اليَدُ حاسَّةُ اللَّمْسِ.",
 "قالَ الجَميعُ: نُحافِظُ على سَلامَةِ هذِهِ الحَواسِّ ، ونَعْتَني بِنَظافَتِها ونَبْتَعِدُ عَنِ الأَشْياءِ الَّتي تَضُرُّها."
 ],
 khat:"أَنا أَرى وأَسْمَعُ وأَشُمُّ وأَذوقُ وأَلْمِسُ وأُفَكِّرُ."},

{id:"layla",t:"لَيْلى والذِّئْبُ",k:"lesson",p:[104,105,106,107],ill:104,
 tx:[
 "لَيْلى تِلْميذَةٌ مُجْتَهِدَةٌ مَحْبوبَةٌ ، تُسْرِعُ إلى البَيْتِ كُلَّ يَوْمٍ بَعْدَ انْتِهاءِ الدُّروسِ في المَدْرَسَةِ ، لِتُعاوِنَ أُمَّها في شُؤونِ البَيْتِ.",
 "رَجَعَتْ بَعْدَ ظُهْرِ يَوْمٍ إلى البَيْتِ ، فَرَأَتْ كَعْكاً كَثيراً على المائِدَةِ ، فَسَأَلَتْ أُمَّها: لِمَنْ صَنَعْتِ هذا الكَعْكَ يا أُمّاهُ؟",
 "قالَتْ: صَنَعْتُ هذا الكَعْكَ لِجَدَّتِكِ يا عَزيزَتي! فَهَلْ تُحِبّينَ أَنْ تَذْهَبي بِهِ إِلَيْها؟",
 "قالَتْ لَيْلى: نَعَمْ يا أُمِّي العَزيزَةَ ، سَأَذْهَبُ لأُسَلِّمَ عَلَيْها ، وآخُذُ الكَعْكَ مَعي إِلَيْها.",
 "سارَتْ لَيْلى وَحْدَها في الطَّريقِ ، وكانَ الطَّريقُ خالِياً مِنَ النّاسِ وإِذا بِذِئْبٍ خَبيثٍ يُفاجِئُ لَيْلى الصَّغيرَةَ ، فَيَسْأَلُها: أَيْنَ تَذْهَبينَ يا عَزيزَتي الصَّغيرَةَ؟",
 "قالَتْ لَيْلى: أَنا ذاهِبَةٌ إلى جَدَّتي العَجوزِ ، لأُسَلِّمَ عَلَيْها ، وأُعْطِيَها هذا الكَعْكَ اللَّذيذَ الَّذي صَنَعَتْهُ أُمّي لَها.",
 "قالَ الذِّئْبُ: وأَيْنَ تُقيمُ جَدَّتُكِ العَجوزُ؟",
 "قالَتْ لَيْلى: إِنَّها تَسْكُنُ في ذلِكَ البَيْتِ الأَبْيَضِ الَّذي تَراهُ في آخِرِ هذا الطَّريقِ ، قُرْبَ الغابَةِ.",
 "فَنَظَرَ الخَبيثُ إلى المَنْزِلِ الَّذي أَشارَتْ إِلَيْهِ لَيْلى ، فَعَرَفَهُ ، فَقالَ لَها: إِذا دَخَلْتِ على جَدَّتِكِ ، فَسَلِّمي لي عَلَيْها كَثيراً ، وقولي لَها إِنَّ ابْنَ أَخيكِ مُشْتاقٌ إِلَيْكِ كَثيراً.",
 "وأَسْرَعَ إلى الدّارِ مِنْ طَريقٍ آخَرَ ، فَوَصَلَ إِلَيْها قَبْلَ أَنْ تَصِلَ إِلَيْها لَيْلى فَوَجَدَ البابَ مَفْتوحاً ، فَدَخَلَ الدّارَ وهَجَمَ على جَدَّةِ لَيْلى العَجوزِ لِيَفْتَرِسَها ، لكِنَّها فَرَّتْ مِنْ بابٍ آخَرَ ، بَعْدَ أَنْ أَصابَها بِجُروحٍ.",
 "لَبِسَ الذِّئْبُ ثِيابَها ونامَ في الفِراشِ. ولَمّا وَصَلَتْ لَيْلى إلى دارِ جَدَّتِها نادَتْ بِأَعْلى صَوْتِها: جَدَّتي ، جَدَّتي! افْتَحي البابَ يا جَدَّتي! لَقَدْ أَرْسَلَتْني أُمّي بِهذا الكَعْكِ إِلَيْكِ.",
 "فَقالَ لَها الذِّئْبُ الخَبيثُ بِصَوْتٍ خائِفٍ: اُدْخُلي يا عَزيزَتي لَيْلى ، فَإِنَّ البابَ مَفْتوحٌ.",
 "فَدَخَلَتْ لَيْلى الدّارَ ، وظَنَّتْ أَنَّ جَدَّتَها مُضْطَجِعَةٌ على سَريرِها لِتَسْتَريحَ ، فَأَسْرَعَتْ إِلَيْها فَرِحَةً ضاحِكَةً لِتُعْطِيَها الكَعْكَ ، وهِيَ تَقولُ لَها: خُذي هذا الكَعْكَ يا جَدَّتي إِنَّهُ كَعْكٌ لَذيذٌ صَنَعَتْهُ لَكِ أُمّي.",
 "فَقالَ الذِّئْبُ الخَبيثُ: ضَعي الكَعْكَ هُناكَ يا لَيْلى! وتَعالَيْ نامي مَعي يا ابْنَتي الحَبيبَةَ.",
 "فَوَضَعَتْ لَيْلى الكَعْكَ على المائِدَةِ ، وذَهَبَتْ إلى الفِراشِ ، فَلاحَتْ لَها أَسْنانُ الذِّئْبِ الطَّويلَةُ ، فَظَنَّتْها أَسْنانَ جَدَّتِها ، فَتَعَجَّبَتْ مِمّا رَأَتْ وقالَتْ: ما بالُ أَسْنانِكِ طَويلَةً يا جَدَّتي؟",
 "فَقالَ لَها الذِّئْبُ بِصَوْتٍ مُخيفٍ: لآكُلَكِ بِها!",
 "فَأَدْرَكَتْ لَيْلى أَنَّهُ الذِّئْبُ ، فَفَزِعَتْ وصَرَخَتْ مُسْتَنْجِدَةً مُسْتَغيثَةً.",
 "وكانَ خالُها قَدِ ازْدادَ شَوْقُهُ إلى أُمِّهِ في ذلِكَ اليَوْمِ ، فَأَتى بَيْتَها. فَلَمّا وَصَلَ إلى البابِ سَمِعَ صُراخَ لَيْلى ، وهِيَ تَسْتَغيثُ مِنَ الذِّئْبِ الَّذي هَجَمَ على جَدَّتِها ، فَأَسْرَعَ إِلَيْهِ وضَرَبَهُ بِالعَصا فَهَرَبَ الذِّئْبُ ، ونَجَتْ لَيْلى مِنَ المَوْتِ."
 ],
 w:[["مُجْتَهِدَةٌ","تَبْذُلُ جُهْدَها في الدِّراسَةِ"],["تَسْتَغيثُ","تَطْلُبُ النَّجْدَةَ"],["الخَبيثُ","الشِّرِّيرُ"]]}
);

 "فَأَصْبَحَ السَّفَرُ سَهْلاً. يَصِلُ الإِنْسانُ إلى المَكانِ الَّذي يُريدُهُ بِسُرْعَةٍ.",

{id:"sport",t:"أُحِبُّ الرِّياضَةَ",k:"lesson",p:[112,113,114,115],ill:112,
 tx:[
 "سَأَلَتْ مُعَلِّمَةُ الرِّياضَةِ الأَطْفالَ: ما الرِّياضَةُ الَّتي تُحِبّونَها؟",
 "قالَ سَميرٌ: أُحِبُّ لُعْبَةَ كُرَةِ القَدَمِ ، لأَنَّها تُعَلِّمُني سُرْعَةَ الحَرَكَةِ وتُعَلِّمُني التَّعاوُنَ مَعَ أَصْدِقائي ، فَالفَريقُ المُتَعاوِنُ هُوَ الفَريقُ الَّذي يَفوزُ.",
 "قالَتْ هَيْفاءُ: أُحِبُّ لُعْبَةَ القَفْزِ على الحَبْلِ ، لأَنَّها تَجْعَلُني أَطيرُ في الهَواءِ مِثْلَ الطَّيْرِ.",
 "قالَ سِنانٌ: أُحِبُّ السِّباحَةَ لأَنَّها تُقَوّي جِسْمي. وقَدْ تَعَلَّمْتُها في مَسْبَحِ المَدينَةِ.",
 "قالَتْ جَميلَةُ: أُحِبُّ لُعْبَةَ القِطارِ ، فَهِيَ تُعَلِّمُنا حُبَّ السَّفَرِ.",
 "قالَتِ المُعَلِّمَةُ: شُكْراً لَكُمْ ، أَلْعابُكُمْ مُفيدَةٌ ومُسَلِّيَةٌ ، الأَلْعابُ الرِّياضِيَّةُ تُقَوّي الأَجْسامَ ، وتُنَشِّطُ العُقولَ ، وتُعَلِّمُنا حُبَّ التَّعاوُنِ وحُبَّ النِّظامِ. أُريدُ أَنْ تُحِبّوا الرِّياضَةَ لِتَعيشوا سُعَداءَ أَقْوِياءَ."
 ],
 khat:"الفَريقُ المُتَعاوِنُ والمُدَرِّبُ والمُنَظِّمُ هُوَ الَّذي يَفوزُ."},
{id:"team",t:"المُحادَثَةُ: الفَريقُ الفائِزُ",k:"expr",p:[116],
 tx:[
 "المُعَلِّمُ: كَيْفَ يَفوزُ الفَريقُ في لُعْبَةِ القَدَمِ؟",
 "سَعْدٌ: إِذا تَعاوَنَ أَعْضاءُ الفَريقِ. فَالفَريقُ المُتَعاوِنُ هُوَ الَّذي يَفوزُ.",

 ]},
{id:"clean3",t:"النَّظافَةُ",k:"expr",p:[115],

 "قالَ عادِلٌ: أَنا آسِفٌ ثُمَّ جَمَعَ ما رَماهُ ووَضَعَهُ في سَلَّةِ الأَوْساخِ."
 ]}

LS.push(
{id:"sesame",t:"اِفْتَحْ يا سِمْسِمُ",k:"lesson",p:[117,118,119,120],ill:117,
 tx:[
 "كانَ في قَديمِ الزَّمانِ ، رَجُلٌ اسْمُهُ عَلي بابا. رَكِبَ عَلي بابا حِمارَهُ وذَهَبَ إلى الغابَةِ لِيَجْمَعَ الحَطَبَ.",
 "رَأى عَلي بابا مِنْ بَعيدٍ أَرْبَعينَ رَجُلاً يَقِفونَ أَمامَ مَغارَةٍ يَتَحَدَّثونَ عَنْ أَمْوالٍ مَسْروقَةٍ.",
 "سَمِعَ أَحَدَهُمْ يَصيحُ: (( اِفْتَحْ يا سِمْسِمُ )) اِنْفَتَحَ بابُ المَغارَةِ ودَخَلَ الرِّجالُ المَغارَةَ ثُمَّ خَرَجوا مِنْها بَعْدَ قَليلٍ فَصاحَ رَجُلٌ: (( أَغْلِقْ يا سِمْسِمُ )) فَانْغَلَقَ بابُ المَغارَةِ.",
 "اِنْتَظَرَ عَلي بابا حَتّى ابْتَعَدَ الرِّجالُ ثُمَّ تَقَدَّمَ مِنَ المَغارَةِ وصاحَ: (( اِفْتَحْ يا سِمْسِمُ )) فَانْفَتَحَ البابُ ، ودَخَلَ عَلي بابا المَغارَةَ فَوَجَدَ أَكْياساً فيها ذَهَبٌ وفِضَّةٌ ، وعَرَفَ أَنَّ الرِّجالَ الَّذينَ رَآهُمْ لُصوصٌ.",
 "فَخَرَجَ مِنَ المَغارَةِ وصاحَ: (( أَغْلِقْ يا سِمْسِمُ )) فَانْغَلَقَ بابُ المَغارَةِ.",
 "أَسْرَعَ عَلي بابا إلى المَدينَةِ فَأَخْبَرَ حاكِمَ المَدينَةِ عَنِ اللُّصوصِ. أَرْسَلَ حاكِمُ المَدينَةِ جُنودَهُ إلى المَغارَةِ.",
 "وقَفَ عَلي بابا مَعَ الجُنودِ أَمامَ المَغارَةِ وصاحَ: (( اِفْتَحْ يا سِمْسِمُ )) فَانْفَتَحَ البابُ ودَخَلَ الجُنودُ وقَبَضوا على اللُّصوصِ ، ثُمَّ حَمَلوا أَكْياسَ الذَّهَبِ والفِضَّةِ وعادوا بِها إلى حاكِمِ المَدينَةِ.",
 "فَرِحَ حاكِمُ المَدينَةِ وقالَ: هذِهِ أَمْوالٌ مَسْروقَةٌ ، نُعيدُها إلى أَصْحابِها. أَنْتَ شُجاعٌ وأَمينٌ يا عَلي بابا. ثُمَّ شَكَرَهُ حاكِمُ المَدينَةِ على شَجاعَتِهِ وأَمانَتِهِ.",
 "عاشَ عَلي بابا مَسْروراً وعاشَ النّاسُ مَسْرورينَ آمِنينَ."
 ],
 w:[["مَغارَةٌ","كَهْفٌ في الجَبَلِ"],["الحَطَبُ","أَغْصانٌ يابِسَةٌ تُحْرَقُ"],["أَمينٌ","صادِقٌ لا يَخونُ"]]}
);

{id:"hare",t:"الأَرْنَبُ المَغْرورُ والسُّلَحْفاةُ",k:"lesson",p:[123,124,125,126],ill:123,
 tx:[

 "وفي يَوْمٍ مِنَ الأَيّامِ قالَ الأَرْنَبُ: يا صَديقَتي السُّلَحْفاةُ ، ماذا نَأْكُلُ اليَوْمَ؟",
 "قالَتِ السُّلَحْفاةُ: هُناكَ تَحْتَ شَجَرَةِ التّينِ جَزَرٌ كَثيرٌ ، تَعالَ نَذْهَبْ بِسُرْعَةٍ ونَأْكُلْهُ.",
 "قالَ الأَرْنَبُ: لا أُريدُ أَنْ أَذْهَبَ الآنَ ، أُريدُ أَنْ أَرْكُضَ وأَلْعَبَ. اِذْهَبي أَنْتِ وسَأَحْضُرُ بَعْدَ قَليلٍ ، وسَوْفَ أَصِلُ قَبْلَكِ لأَنَّني أُسْرِعُ مِنْكِ.",
 "قالَتِ السُّلَحْفاةُ: أَنا ذاهِبَةٌ ، وسَوْفَ تَرى مَنْ يَسْبِقُ.",
 "مَشَتِ السُّلَحْفاةُ ومَشَتْ ، ولَمْ تَقِفْ في الطَّريقِ ، ولَمْ تَلْعَبْ.",
 "لَعِبَ الأَرْنَبُ ولَعِبَ ولَعِبَ وضَيَّعَ الوَقْتَ ، وأَرادَ أَنْ يَنامَ ، لكِنَّ النَّسْرَ هاجَمَهُ فَبَدَأَ يَرْكُضُ ويَرْكُضُ.",
 "كانَتْ شَجَرَةُ التّينِ بَعيدَةً ، ورَأى الأَرْنَبُ السُّلَحْفاةَ تَقْتَرِبُ مِنَ الشَّجَرَةِ ، فَأَخَذَ يُسْرِعُ ويُسْرِعُ.",

 ],

LS.push(

 tx:[

 "ولَوْلا الشَّمْسُ لانْتَهَتْ حَياةُ الإِنْسانِ والحَيَوانِ والنَّباتِ. هِيَ مَصْدَرُ النّورِ ، تُرْسِلُ أَشِعَّتَها إلى مياهِ البِحارِ ، فَيَتَحَوَّلُ قِسْمٌ مِنَ الماءِ إلى بُخارٍ ، يَحْمِلُهُ الهَواءُ إلى أَعالي الجَوِّ في السَّماءِ.",
 "فَتَتَكَوَّنُ الغُيومُ الَّتي تَنْزِلُ على الأَرْضِ مَطَراً ، فَيُنْبِتُ النَّباتُ ، وتَجْري الأَنْهارُ والجَداوِلُ ، ويَتَدَفَّقُ الماءُ مِنَ اليَنابيعِ والآبارِ.",
 "وعِنْدَما يَنْزِلُ المَطَرُ نَرى الطَّيْفَ الشَّمْسِيَّ ، إِنَّهُ جَميلٌ لَهُ سَبْعَةُ أَلْوانٍ ، البَنَفْسَجِيُّ والنِّيلِيُّ والأَزْرَقُ والأَخْضَرُ والأَصْفَرُ والبُرْتُقالِيُّ والأَحْمَرُ.",
 "سَأَلَتْ لَيْلى مُعَلِّمَتَها: ما سَبَبُ هذِهِ الأَلْوانِ؟",

 "قالَتْ لَيْلى: أَنا أُحِبُّ أَشِعَّةَ الشَّمْسِ لأَنَّها تُعْطينا الضَّوْءَ والحَرارَةَ ، وأُمّي أَيْضاً تُحِبُّها.",
 "فَهِيَ تَفْتَحُ نَوافِذَ بَيْتِنا كُلَّ صَباحٍ لِتَدْخُلَ أَشِعَّةُ الشَّمْسِ إلى الغُرَفِ ، فَتَقْتُلَ الجَراثيمَ الَّتي تُسَبِّبُ الأَمْراضَ ، وعِنْدَما نَغْسِلُ المَلابِسَ ، ونَنْشُرَها على حَبْلِ الغَسيلِ ، تَجِفُّ بِسُرْعَةٍ بِفَضْلِ أَشِعَّةِ الشَّمْسِ. إِنَّها نِعْمَةٌ مِنَ اللَّهِ تَعالى."
 ],
 khat:"أَشِعَّةُ الشَّمْسِ نِعْمَةٌ مِنْ نِعَمِ اللَّهِ تَعالى عَلَيْنا.",

  }else{

function showFinal(hidden){

  <div class="row"><button class="big" id="again" data-snd="start">${ic("redo",20)} ${all?"اقرأ مرة ثانية":"أكمل المقاطع الباقية"}</button><button class="ghost" id="togm" data-snd="open">${ic("game",20)} العب</button></div></div>`;

}

function drawBook(){BP=Math.max(1,Math.min(144,BP));$("#bim").src=`${pg3(BP)}.webp`;$("#bpg").textContent="صفحة "+AR(BP)+" / "+AR(144);const l=LS.find(l=>l.p.includes(BP));$("#bt").textContent=l?l.t:"الكتاب"}

{let x0=null;const f=$("#bk .fr");f.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});f.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){BP+=dx<0?1:-1;snd("flip");drawBook()}x0=null})}
/* ===== الألعاب ===== */
const gm=$("#gm"),gb=$("#gb"),fbEl=$("#fb"),gbar=$("#gbar");let nextFn=null,GCTX=null;
function openG(fn,u){gm.dataset.u=u||3;gm.classList.add("on");gm.setAttribute("aria-hidden","false");fn()}

const prog=p=>gbar.style.width=Math.min(100,p)+"%";
function fb(txt,next){nextFn=next;fbEl.className="fb on ok";fbEl.innerHTML=`<div><b>أحسنت!</b><p>${txt}</p></div><button data-snd="next" id="fbn">متابعة</button>`;$("#fbn").onclick=()=>{fbEl.className="fb";nextFn()}}
function finishG(key,k){snd("done");confetti();const id=GCTX&&GCTX.id;if(id){const s=LL(id);s.g[key]=Math.max(s.g[key]||0,k)}addStars(k);touchDay();sv("q3",S);
  scr(`<div class="res">${tlHTML("g")}<h2>${k>=3?"ممتاز!":k===2?"رائع!":"أحسنت!"}</h2><p>${"⭐".repeat(k)} +${AR(k)}</p><div class="row"><button class="big" id="ag" data-snd="start">${ic("redo",20)} مرة ثانية</button><button class="ghost" id="cl" data-snd="back">إغلاق</button></div></div>`,100);
  $("#ag").onclick=()=>GAMES[key].run(GCTX);$("#cl").onclick=shut}
/* مجمع الجمل */
const okChunk=t=>{const n=wordsOf(t).filter(w=>norm(w)).length;return n>=4&&n<=14};
function poolFor(ctx){
  if(ctx.id)return CH[ctx.id].filter(okChunk).map(t=>({t,id:ctx.id}));
  const a=[];sh(LS).slice(0,14).forEach(l=>{const c=CH[l.id].filter(okChunk);if(c.length)a.push({t:sh(c)[0],id:l.id})});return a;
}
function wordPool(ctx){const ids=ctx.id?[ctx.id]:LS.map(l=>l.id);const s=new Set();ids.forEach(i=>CH[i].forEach(t=>wordsOf(t).forEach(w=>{if(norm(w).length>=3)s.add(w.replace(/[،.؟!:()«»"]/g,""))})));return [...s]}
function strip(w){return w.replace(/[،.؟!:()«»"]/g,"")}
/* 1. أكمل الكلمة */
function runCloze(ctx){
  GCTX=ctx;const P=sh(poolFor(ctx)).slice(0,6),WP=wordPool(ctx);if(!P.length)return scr('<p class="hint">ما في جمل كافية</p>');
  let i=0,first=0;
  const go=()=>{
    if(i===P.length)return finishG("clz",first>=5?3:first>=3?2:1);
    const ws=wordsOf(P[i].t),cand=ws.map((w,j)=>[w,j]).filter(([w])=>norm(w).length>=3);
    const [ans,j]=cand[Math.random()*cand.length|0],ap=strip(ans);
    const d=sh(WP.filter(w=>norm(w)!==norm(ap))).slice(0,2),opts=sh([ap,...d]);let tried=false;
    scr(`<p class="hint">اختر الكلمة الناقصة</p><div class="q">${ws.map((w,k)=>k===j?`<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;&nbsp;</span>`:w).join(" ")}</div><div class="chs">${opts.map(o=>`<button class="ch">${o}</button>`).join("")}</div>`,i/P.length*100);
    $$(".ch").forEach(b=>b.onclick=()=>{
      if(norm(b.textContent)===norm(ap)){b.classList.add("ok");$("#bl").textContent=ap;$("#bl").classList.add("ok");snd("right");if(!tried)first++;i++;fb("إجابة صحيحة",go)}
      else{b.classList.add("no");snd("wrong");tried=true}});
  };go();
}
/* 2. ركّب الجملة */
function runBuild(ctx){
  GCTX=ctx;const P=sh(poolFor(ctx).filter(p=>wordsOf(p.t).length<=9)).slice(0,5);if(!P.length)return runCloze(ctx);let i=0,first=0;
  const go=()=>{
    if(i===P.length)return finishG("bld",first>=4?3:first>=2?2:1);
    const ws=wordsOf(P[i].t);let n=0,err=false;
    scr(`<p class="hint">رتّب الكلمات لتكوّن الجملة</p><div class="slot" id="sl"></div><div class="chs">${sh(ws.map((w,k)=>({w,k}))).map(o=>`<button class="ch" data-k="${o.k}">${o.w}</button>`).join("")}</div>`,i/P.length*100);
    $$(".ch").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("ok"))return;
      if(norm(ws[n])===norm(b.textContent)||b.textContent===ws[n]){b.classList.add("ok");snd("line",n);const sl=$("#sl");sl.innerHTML+=`<span class="w" style="font:700 26px/2 Amiri,serif;color:var(--okc)">${ws[n]}</span> `;n++;if(n===ws.length){if(!err)first++;i++;snd("right");fb("جملة صحيحة",go)}}
      else{b.classList.add("no");snd("wrong");err=true;setTimeout(()=>b.classList.remove("no"),400)}});
  };go();
}
/* 3. رتّب الجمل */
function runOrder(ctx){
  GCTX=ctx;let src=ctx.id?CH[ctx.id]:LS.flatMap(l=>CH[l.id].slice(0,3));
  let base=ctx.id?src:sh(LS).map(l=>CH[l.id]).find(c=>c.length>=4)||src;
  if(base.length<3)return runCloze(ctx);
  const st=Math.random()*Math.max(1,base.length-4)|0,sel=base.slice(st,st+Math.min(5,base.length));
  const items=sel.map((t,i)=>({t,i}));let n=0,err=0;
  scr(`<p class="hint">اضغط الجمل بالترتيب الصحيح</p><div class="slot" id="sl"></div><div id="ch">${sh(items).map(o=>`<button class="ch" style="display:block;width:100%;font-size:21px;line-height:2" data-i="${o.i}">${o.t}</button>`).join("")}</div>`,0);
  $$("#ch .ch").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("ok"))return;
    if(+b.dataset.i===n){b.classList.add("ok");b.style.opacity=.35;snd("line",n);$("#sl").innerHTML+=`<p>${b.textContent}</p>`;n++;prog(n/sel.length*100);if(n===sel.length)setTimeout(()=>finishG("ord",err<=1?3:err<=3?2:1),500)}
    else{b.classList.add("no");snd("wrong");err++;setTimeout(()=>b.classList.remove("no"),400)}});
}
/* 4. اكتشف الخطأ */
function runSpot(ctx){
  GCTX=ctx;const P=sh(poolFor(ctx)).slice(0,6),WP=wordPool(ctx);if(!P.length)return runCloze(ctx);let i=0,first=0;
  const go=()=>{
    if(i===P.length)return finishG("spt",first>=5?3:first>=3?2:1);
    const ws=wordsOf(P[i].t),cand=ws.map((w,j)=>j).filter(j=>norm(ws[j]).length>=3),j=cand[Math.random()*cand.length|0];
    const rep=sh(WP.filter(w=>norm(w)!==norm(ws[j])&&Math.abs(norm(w).length-norm(ws[j]).length)<=2))[0]||"ولد";let tried=false;
    const sw=ws.slice();sw[j]=rep;
    scr(`<p class="hint">فيه كلمة غلط في الجملة، اضغط عليها</p><div class="q">${sw.map((w,k)=>`<span class="w tg" data-k="${k}" style="cursor:pointer">${w}</span>`).join(" ")}</div>`,i/P.length*100);
    $$(".q .w").forEach(w=>w.onclick=()=>{
      if(+w.dataset.k===j){w.className="w ok tg";w.textContent=ws[j];snd("right");if(!tried)first++;i++;fb("لقطتها!",go)}
      else{w.className="w bad tg";snd("wrong");tried=true;setTimeout(()=>{if(+w.dataset.k!==j)w.className="w tg"},500)}});
  };go();
}
/* 5. ذاكرة الكلمات */
function runMem(ctx){
  GCTX=ctx;let pairs=[];
  const l=ctx.id?BY[ctx.id]:null;
  if(l&&l.w)l.w.forEach(p=>pairs.push([p[0],p[1],1]));
  const wp=sh(ctx.id?CH[ctx.id].flatMap(wordsOf):LS.flatMap(x=>CH[x.id].slice(0,2).flatMap(wordsOf))).map(strip).filter(w=>norm(w).length>=3&&/[ً-ٟ]/.test(w));
  const seen=new Set(pairs.map(p=>norm(p[0])));
  for(const w of wp){if(pairs.length>=6)break;if(!seen.has(norm(w))){seen.add(norm(w));pairs.push([w,plain(w),0])}}
  pairs=pairs.slice(0,6);if(pairs.length<3)return runCloze(ctx);
  const d=sh(pairs.flatMap((p,i)=>[{i,t:p[0]},{i,t:p[1],s:p[2]}]));let sel=[],m=0,lock=false,miss=0;
  scr(`<p class="hint">اقلب بطاقتين متطابقتين${pairs[0][2]?" (الكلمة ومعناها)":" (الكلمة مع نفسها بدون تشكيل)"}</p><div class="mem" id="mm">${d.map((c,k)=>`<button class="mc" data-k="${k}"><span class="in"><span class="f">${ic("star",26)}</span><span class="bk${c.s||c.t.length>9?" s":""}">${c.t}</span></span></button>`).join("")}</div>`,0);
  $$(".mc").forEach(c=>c.onclick=()=>{
    if(lock||c.classList.contains("up")||c.classList.contains("dn"))return;
    c.classList.add("up");snd("flip");sel.push(c);
    if(sel.length===2){
      lock=true;const[a,b]=sel;
      if(d[+a.dataset.k].i===d[+b.dataset.k].i){setTimeout(()=>{a.className=b.className="mc dn";snd("match");sel=[];lock=false;m++;prog(m/pairs.length*100);if(m===pairs.length)setTimeout(()=>finishG("mem",miss<=3?3:miss<=6?2:1),500)},400)}
      else{miss++;setTimeout(()=>{a.classList.remove("up");b.classList.remove("up");snd("miss");sel=[];lock=false},800)}}});
}
/* 6. اكتب بإصبعك */
function writeGame(id,ctx){
  GCTX=ctx||{id};const l=id?BY[id]:null;
  let ws=[];
  if(l&&l.khat)ws=wordsOf(l.khat).map(strip).filter(w=>norm(w).length>=2);
  if(l&&ws.length<3)ws=ws.concat(CH[id].flatMap(wordsOf).map(strip).filter(w=>norm(w).length>=3));
  if(!l)ws=sh(LS.flatMap(x=>x.khat?wordsOf(x.khat):[])).map(strip).filter(w=>norm(w).length>=3);
  ws=[...new Set(ws)].slice(0,5);if(!ws.length)return;
  const inGm=!!ctx;const host=inGm?gb:ob;
  let i=0;
  const go=()=>{
    if(i===ws.length){if(inGm)return finishG("wrt",3);addStars(3);const s=LL(id);s.g.wrt=3;sv("q3",S);snd("done");confetti();host.innerHTML=`<div class="res">${tlHTML("g")}<h2>كتبت بإتقان!</h2><p>⭐⭐⭐</p><div class="row"><button class="big" id="wa" data-snd="start">${ic("redo",20)} مرة ثانية</button></div></div>`;$("#wa").onclick=()=>writeGame(id);return}
    const w=ws[i];
    host.innerHTML=`<p class="hint" style="text-align:center">تتبّع الكلمة بإصبعك (${AR(i+1)}/${AR(ws.length)})</p><div class="pad" id="pd"><canvas id="mk" style="opacity:.22"></canvas><canvas id="cv"></canvas></div><div class="live" id="wl">ارسم فوق الكلمة بالضبط</div><div class="row"><button class="ghost" id="er" data-snd="erase">${ic("redo",20)} امسح</button><button class="big ok" id="dn" data-snd="ok">${ic("check",20)} انتهيت</button></div>`;
    if(inGm)prog(i/ws.length*100);
    const pd=$("#pd"),cv=$("#cv"),mk=$("#mk"),r=window.devicePixelRatio||1,W=pd.clientWidth,H=pd.clientHeight;
    [cv,mk].forEach(c=>{c.width=W*r;c.height=H*r});
    const cx=cv.getContext("2d"),mx=mk.getContext("2d");cx.scale(r,r);mx.scale(r,r);
    let fs=Math.min(130,H*.62);const draw=(ctx2,mode)=>{ctx2.save();ctx2.direction="rtl";ctx2.textAlign="center";ctx2.textBaseline="middle";ctx2.font=`700 ${fs}px Amiri,serif`;while(ctx2.measureText(w).width>W*.9&&fs>34){fs-=4;ctx2.font=`700 ${fs}px Amiri,serif`}if(mode==="s"){ctx2.lineWidth=34;ctx2.lineJoin="round";ctx2.strokeText(w,W/2,H/2)}ctx2.fillStyle="#fff";ctx2.fillText(w,W/2,H/2);ctx2.restore()};
    (document.fonts&&document.fonts.load?document.fonts.load("700 80px Amiri",w):Promise.resolve()).then(()=>{mx.clearRect(0,0,W,H);draw(mx)});
    cx.lineCap="round";cx.lineJoin="round";cx.lineWidth=16;cx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--c3").trim()||"#ffb938";
    let dr=false,lx=0,ly=0,len=0;
    const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
    cv.onpointerdown=e=>{dr=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(lx+.1,ly);cx.stroke()};
    cv.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(x,y);cx.stroke();const d=Math.hypot(x-lx,y-ly);len+=d;lx=x;ly=y;if(len>28){len=0;snd("pen",d)}};
    cv.onpointerup=cv.onpointercancel=()=>dr=false;
    $("#er").onclick=()=>cx.clearRect(0,0,W,H);
    $("#dn").onclick=()=>{
      const wl=$("#wl"),M=document.createElement("canvas");M.width=W*r;M.height=H*r;const m2=M.getContext("2d");m2.scale(r,r);draw(m2);
      const D=document.createElement("canvas");D.width=W*r;D.height=H*r;const d2=D.getContext("2d");d2.scale(r,r);draw(d2,"s");
      const a=m2.getImageData(0,0,M.width,M.height).data,b=cx.getImageData(0,0,cv.width,cv.height).data,dd=d2.getImageData(0,0,D.width,D.height).data;
      let tot=0,cov=0,ink=0,out=0;
      for(let p=3;p<a.length;p+=16){const mk1=a[p]>100,dk=dd[p]>100,ik=b[p]>100;if(mk1){tot++;if(ik)cov++}if(ik){ink++;if(!dk)out++}}
      const c=tot?cov/tot:0,o=ink?out/ink:1;
      if(ink<20){setTL2("حاول ترسم فوق الكلمة أولاً","no");return}
      if(c>=.55&&o<.4){wl.className="live ok";wl.textContent="كتابة جميلة!";snd("right");i++;if(inGm)prog(i/ws.length*100);setTimeout(go,900)}
      else{wl.className="live no";wl.textContent=c<.55?"ما غطّيت كل الكلمة، كمّل الرسم":"طلعت عن الخط شوية، امسح وحاول بهدوء";snd("wrong")}
    };
    function setTL2(t,c){const wl=$("#wl");wl.textContent=t;wl.className="live "+(c||"")}
  };go();
}
const GAMES={
 clz:{t:"أكمل الكلمة",d:"اختر الكلمة الناقصة",ic:"pen",run:runCloze,s:"g_clz"},
 bld:{t:"ركّب الجملة",d:"رتّب كلمات الجملة",ic:"bolt",run:runBuild,s:"g_bld"},

 spt:{t:"اكتشف الخطأ",d:"أي كلمة غلط؟",ic:"eye",run:runSpot,s:"g_spt"},
 mem:{t:"ذاكرة الكلمات",d:"طابق البطاقات",ic:"star",run:runMem,s:"g_mem"},

  $$("#ob .big-card").forEach(c=>c.onclick=()=>openG(()=>GAMES[c.dataset.k].run({id:CUR.id}),ov.dataset.u));

  $("#g3").innerHTML=mixes.map(k=>{const g=GAMES[k];return `<button class="glass big-card" data-k="${k}" data-snd="${g.s}"><span class="ico">${ic(g.ic,26)}</span><span><h3>${g.t} <small style="font-weight:500;color:var(--mut)">· مختلط</small></h3><p>${g.d} من كل دروس الكتاب</p></span></button>`}).join("");
  $$("#g3 .big-card").forEach(c=>c.onclick=()=>openG(()=>GAMES[c.dataset.k].run({}),3));
}
/* ===== تشغيل ===== */
touchDay();sv("q3",S);hud();sndBtn();go(0);
window.__app={LS,CH,S,align,norm,chunkLine,openL};
